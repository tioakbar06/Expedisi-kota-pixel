<style>
/* =====================================================================
   TEMA "EKSPEDISI KOTA PIKSEL" — dioptimalkan untuk PID 16:9 layar sentuh
   ===================================================================== */
:root {
  --krem: #FFF8EE; --krem2: #FBEBD3; --garis: #EADFCB;
  --navy: #1D3557; --navy2: #2B4C7E; --teks2: #5A6B85;
  --teal: #2A9D8F; --teal-d: #1F7A70; --oranye: #F4A261; --koral: #E76F51; --emas: #E9C46A;
  --benar: #2ECC71; --salah: #E74C3C;
  --r: 1.2rem; --bayang: 0 .4rem 1.4rem rgba(29, 53, 87, .13); --bayang-kuat: 0 1rem 3rem rgba(29, 53, 87, .25);
  --sentuh: max(64px, 3.1rem);
  --bar: max(76px, 8.4vh);
  --font: Nunito, "Nunito Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: clamp(16px, calc(.95vw + .25vh), 44px); }
html, body { margin: 0; height: 100%; }
body {
  background: var(--krem); color: var(--navy); font-family: var(--font); line-height: 1.45;
  overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
input, textarea, select { user-select: text; -webkit-user-select: text; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:disabled { opacity: .45; cursor: not-allowed; }
h1, h2, h3 { margin: 0 0 .5em; line-height: 1.15; }
p { margin: 0 0 .6em; }
.ic { width: 1.25em; height: 1.25em; flex: none; display: block; }
.ikw { display: inline-flex; align-items: center; justify-content: center; }
.lead { font-size: 1.15rem; color: var(--teks2); }
.catatan { font-size: .9rem; color: var(--teks2); }
.tengah { text-align: center; }
:focus-visible { outline: 4px solid var(--oranye); outline-offset: 3px; }

/* ---------- Tombol ---------- */
.btn {
  position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
  min-height: var(--sentuh); padding: .5rem 1.4rem; border-radius: 1rem; font-weight: 800; font-size: 1.05rem;
  background: #fff; color: var(--navy); box-shadow: var(--bayang); transition: transform .15s, box-shadow .15s, filter .15s;
}
.btn:active:not(:disabled) { transform: scale(.96); }
.btn.primary { background: var(--teal); color: #fff; }
.btn.accent { background: var(--oranye); color: var(--navy); }
.btn.danger { background: var(--koral); color: #fff; }
.btn.ghost { background: #fff; border: 3px solid var(--garis); box-shadow: none; }
.btn.terang { background: rgba(255, 255, 255, .2); color: #fff; box-shadow: none; }
.btn.besar { font-size: 1.25rem; padding: .7rem 2rem; min-height: calc(var(--sentuh) * 1.12); }
.btn.mega { font-size: 1.9rem; padding: .8rem 3rem; min-height: calc(var(--sentuh) * 1.45); border-radius: 1.4rem; letter-spacing: .06em; animation: denyut 2.2s ease-in-out infinite; }
.btn.kecil { font-size: .92rem; padding: .3rem 1rem; min-height: max(56px, 2.6rem); }
.iconbtn {
  position: relative; overflow: hidden; width: var(--sentuh); height: var(--sentuh); border-radius: 1rem; display: grid; place-items: center;
  background: var(--krem); color: var(--navy); transition: transform .15s, background .15s; flex: none;
}
.iconbtn .ic { width: 52%; height: 52%; }
.iconbtn:active { transform: scale(.92); }
.iconbtn.kecil { width: max(56px, 2.6rem); height: max(56px, 2.6rem); }
.iconbtn.terang { background: rgba(255, 255, 255, .22); color: #fff; }
.iconbtn.mati { color: var(--koral); }
.riak { position: absolute; border-radius: 50%; background: currentColor; opacity: .25; transform: scale(0); animation: riak .6s ease-out forwards; pointer-events: none; }
.chip { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: .45rem; min-height: max(56px, 2.6rem); padding: .3rem 1rem; border-radius: 999px; background: #fff; border: 3px solid var(--garis); font-weight: 700; }
.chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.chip.besar { min-height: var(--sentuh); font-size: 1.05rem; background: var(--krem); border-color: transparent; max-width: 22vw; }
.chip.besar span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.merah { border-color: var(--koral); color: #B8432A; min-height: auto; padding: .2rem .8rem; }
.chip.hijau { border-color: var(--teal); color: var(--teal-d); min-height: auto; padding: .2rem .8rem; }
.chips { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.mini-x { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--krem); margin-right: -.6rem; }
.mini-x .ic { width: 60%; height: 60%; }
.aksi { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; margin-top: 1rem; }
.aksi.tengah { justify-content: center; }
.aksi.kanan { justify-content: flex-end; }
.status { font-size: .82rem; font-weight: 800; padding: .25rem .8rem; border-radius: 999px; white-space: nowrap; }
.status.siap { background: #DDF6E8; color: #1E8E4E; }
.status.segera { background: var(--krem2); color: #9A6A24; }
.label-kecil { font-weight: 700; color: var(--teks2); margin-right: .3rem; }

/* ---------- Masukan ---------- */
.inp { font: inherit; font-size: 1.1rem; min-height: var(--sentuh); width: 100%; padding: .55rem 1rem; border-radius: .9rem; border: 3px solid var(--garis); background: #fff; color: var(--navy); }
textarea.inp { min-height: auto; resize: vertical; line-height: 1.4; }
.inp:focus { border-color: var(--teal); outline: none; }
.inp.besar { font-size: 1.4rem; font-weight: 700; }
.getar { animation: getar .45s; border-color: var(--koral) !important; }
.form { display: grid; gap: 1rem; }
.form label { display: grid; gap: .35rem; font-weight: 700; }
.form-baris { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1rem; align-items: end; }
label.cek { display: flex; align-items: center; gap: .7rem; min-height: var(--sentuh); font-weight: 700; }
label.cek input, .saklar input, input[type=radio] { width: 32px; height: 32px; accent-color: var(--teal); flex: none; }

/* ---------- Layar ---------- */
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; opacity: 0; visibility: hidden; transform: scale(1.03); transition: opacity .5s, transform .5s, visibility 0s .5s; }
.screen.on { opacity: 1; visibility: visible; transform: none; transition: opacity .5s, transform .5s; }
svg.city { width: 100%; height: 100%; display: block; }

/* Judul */
#scr-judul { background: linear-gradient(180deg, #CFEFF5 0%, #FFF8EE 70%); }
#scr-judul svg.city { position: absolute; inset: 0; left: 18vw; width: 82vw; }
.judul-kartu { position: relative; z-index: 2; margin: auto 0 auto 5vw; width: min(44rem, 46vw); background: rgba(255, 255, 255, .9); backdrop-filter: blur(6px); border-radius: 2rem; padding: 2.4rem 2.6rem; box-shadow: var(--bayang-kuat); animation: muncul .8s cubic-bezier(.2, .9, .3, 1.2) both; }
.judul-logo { display: flex; align-items: center; gap: .8rem; font-weight: 800; color: var(--teal); font-size: 1.2rem; letter-spacing: .04em; text-transform: uppercase; }
.judul-logo svg { width: 3.2rem; height: 3.2rem; }
.judul-kartu h1 { font-size: 4.6rem; font-weight: 900; margin: .4rem 0 .3rem; letter-spacing: -.01em; }
.judul-tag { display: inline-block; font-size: 1.55rem; font-weight: 900; color: #fff; background: var(--koral); padding: .3rem 1.1rem; border-radius: .8rem; transform: rotate(-1.5deg); margin: .2rem 0 .9rem; }
.judul-sub { font-size: 1.2rem; color: var(--teks2); }
.judul-aksi { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin: 1.4rem 0 1.2rem; }
.judul-kaki { font-size: .95rem; color: var(--teks2); margin: 0; }
.judul-alat { position: absolute; z-index: 3; right: calc(var(--sentuh) + 2.4rem); top: 1.2rem; display: flex; gap: .8rem; }
.judul-alat .iconbtn { background: #fff; box-shadow: var(--bayang); }

/* Identitas */
#scr-identitas { background: radial-gradient(circle at 20% 30%, #E5F5F2, var(--krem) 60%); overflow-y: auto; }
.identitas-wrap { margin: auto; width: min(96vw, 90rem); display: grid; grid-template-columns: .8fr 1.2fr; gap: 3rem; align-items: center; padding: 2rem; }
.identitas-ilus svg { width: 100%; max-height: 70vh; animation: muncul .7s both; }
.identitas-form { background: #fff; border-radius: 2rem; padding: 2.2rem 2.4rem; box-shadow: var(--bayang-kuat); display: grid; gap: .8rem; animation: muncul .7s .1s both; }
.identitas-form h2 { font-size: 2.3rem; font-weight: 900; }
.label-besar { font-weight: 800; font-size: 1.1rem; margin-top: .4rem; }
.anggota-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }

/* ---------- Bilah atas ---------- */
.topbar { display: flex; align-items: center; gap: .8rem; height: var(--bar); padding: 0 1.2rem; background: #fff; box-shadow: 0 .2rem 1rem rgba(29, 53, 87, .08); position: relative; z-index: 35; flex: none; }
.brand { display: flex; align-items: center; gap: .7rem; }
.brand svg { width: calc(var(--bar) * .62); height: calc(var(--bar) * .62); }
.brand b { display: block; font-size: 1.2rem; font-weight: 900; line-height: 1.1; }
.brand small { color: var(--teal); font-weight: 800; font-size: .9rem; }
.spacer { flex: 1; }
.gear-ruang { width: var(--sentuh); flex: none; }

/* ---------- Pita "Kalian di sini" ---------- */
.ribbon { flex: none; padding: .45rem 1.6rem .5rem; background: linear-gradient(180deg, #fff, rgba(255, 255, 255, .6)); border-bottom: 3px dashed var(--garis); position: relative; z-index: 5; }
.rb-kiri { display: contents; }
.rb-jalur { position: relative; padding: 1.55rem 1.1rem 0; }
.rb-garis { position: absolute; left: 2.2rem; right: 2.2rem; top: calc(1.55rem + .95rem - 4px); height: 8px; background: var(--garis); border-radius: 4px; }
.rb-isi { height: 100%; background: var(--teal); border-radius: 4px; transition: width .8s; }
.rb-titik { position: relative; display: flex; justify-content: space-between; }
.rb-node { position: relative; display: grid; place-items: center; }
.rb-bulat { width: 1.9rem; height: 1.9rem; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: .85rem; background: #fff; border: 3px solid var(--garis); color: var(--teks2); }
.rb-node.lewat .rb-bulat { background: var(--teal); border-color: var(--teal); color: #fff; }
.rb-node.kini .rb-bulat { width: 2.5rem; height: 2.5rem; margin: -.3rem; background: var(--oranye); border-color: var(--navy); color: var(--navy); font-size: 1.05rem; box-shadow: 0 0 0 .35rem rgba(244, 162, 97, .3); animation: denyut 2s infinite; }
.rb-bendera { position: absolute; bottom: calc(100% + .35rem); white-space: nowrap; background: var(--navy); color: #fff; font-weight: 800; font-size: .74rem; padding: .1rem .6rem; border-radius: .5rem; }
.rb-node:first-child .rb-bendera { left: -.6rem; } .rb-node:last-child .rb-bendera { right: -.6rem; }
.rb-node:not(:first-child):not(:last-child) .rb-bendera { left: 50%; transform: translateX(-50%); }
.rb-bendera::after { content: ""; position: absolute; left: 1.2rem; top: 100%; border: 6px solid transparent; border-top-color: var(--navy); }
.rb-node:not(:first-child):not(:last-child) .rb-bendera::after { left: 50%; transform: translateX(-50%); }
.rb-node:last-child .rb-bendera::after { left: auto; right: 1.2rem; }
.rb-bawah { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; margin-top: .45rem; }
.rb-hari { display: flex; align-items: center; gap: .5rem; font-size: .98rem; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.rb-hari > span:last-child { overflow: hidden; text-overflow: ellipsis; }
.rb-hari .ic { color: var(--oranye); }
.rb-tahap { display: flex; gap: .3rem; flex: none; }
.rb-pill { display: flex; align-items: center; gap: .4rem; font-weight: 700; font-size: .8rem; color: var(--teks2); padding: .12rem .7rem .12rem .2rem; border-radius: 999px; background: rgba(255,255,255,.7); }
.rb-pill b { width: 1.35rem; height: 1.35rem; border-radius: 50%; display: grid; place-items: center; background: var(--krem2); font-size: .72rem; }
.rb-pill.lewat b { background: var(--teal); color: #fff; }
.rb-pill.kini { background: var(--navy); color: #fff; }
.rb-pill.kini b { background: var(--oranye); color: var(--navy); }

/* ---------- Peta ---------- */
#scr-peta { background: linear-gradient(180deg, #D7F0F4 0%, var(--krem) 55%); }
.map-wrap { flex: 1; position: relative; min-height: 0; }
.hp-distrik { display: none; }
.map-hint { position: absolute; left: 50%; bottom: 1.2vh; transform: translateX(-50%); background: rgba(255, 255, 255, .92); padding: .45rem 1.2rem; border-radius: 999px; font-weight: 700; font-size: .95rem; box-shadow: var(--bayang); display: flex; align-items: center; gap: .6rem; white-space: nowrap; }
.pulse-dot { width: .8rem; height: .8rem; border-radius: 50%; background: var(--koral); animation: denyut 1.4s infinite; }
.city .sentuh { cursor: pointer; }
.city .blk { transition: transform .25s cubic-bezier(.3, 1.4, .5, 1), filter .2s; transform-box: fill-box; transform-origin: 50% 100%; }
.city .blk.sentuh:hover { filter: brightness(1.05) drop-shadow(0 8px 12px rgba(29, 53, 87, .2)); }
.city .blk.tekan { transform: scale(.96) translateY(6px); }
.city .sorot { opacity: 0; transition: opacity .4s; pointer-events: none; }
.city .blk.hl .sorot { opacity: 1; animation: sinar 2.4s ease-in-out infinite; }
.city .papan-nama { transition: transform .2s; }
.city .pn-teks { font-family: var(--font); font-size: 29px; font-weight: 900; fill: var(--navy); }
.city .pn-ket { font-family: var(--font); font-size: 19px; font-weight: 700; fill: var(--teks2); }
.city .papan-nama .pn-garis { opacity: .75; }
.city .papan-nama.hl .pn-garis { opacity: 1; animation: alir 1s linear infinite; }
.city .papan-nama:hover .pn-bg { filter: drop-shadow(0 6px 10px rgba(29,53,87,.25)); }
.city .pn-badge { opacity: 0; transition: opacity .3s; }
.city .papan-nama.hl .pn-badge { opacity: 1; }
.city .papan-nama.hl .pn-badge-in { animation: lompat 1.6s ease-in-out infinite; }
.city .papan-nama.hl .pn-bg { stroke: var(--oranye) !important; stroke-width: 7; }
.city .papan-teks { font-family: var(--font); font-size: 24px; font-weight: 900; fill: #fff; }
.city .papan.sentuh { transition: transform .2s; transform-box: fill-box; transform-origin: 50% 100%; }
.city .papan.sentuh:hover { transform: translateY(-6px); }
.city .putar { animation: putar 14s linear infinite; }
.city .kedip { animation: kedip 1.4s steps(2) infinite; }
.city .bendera { animation: kibar 1.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 0 50%; }
.city .gel { opacity: 0; transform-box: fill-box; transform-origin: center; animation: gelombang 2.4s ease-out infinite; }
.city .gel1 { animation-delay: .8s; } .city .gel2 { animation-delay: 1.6s; }
.city .air { animation: kedip 1.2s ease-in-out infinite alternate; }
.city .awan-0 { animation: awan 40s linear infinite alternate; } .city .awan-1 { animation: awan 55s linear infinite alternate-reverse; }
.city .awan-2 { animation: awan 48s linear infinite alternate; } .city .awan-3 { animation: awan 62s linear infinite alternate-reverse; }

/* ---------- Panel distrik ---------- */
#scrim { position: fixed; inset: var(--bar) 0 0; background: rgba(29, 53, 87, .35); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .4s; z-index: 28; }
#scrim.on { opacity: 1; pointer-events: auto; }
#panel { --warna: var(--teal); position: fixed; top: calc(var(--bar) + 1.2vh); left: 1.4vw; right: 1.4vw; bottom: 1.6vh; z-index: 30; background: var(--krem); border-radius: 1.8rem; box-shadow: var(--bayang-kuat); display: flex; flex-direction: column; overflow: hidden; opacity: 0; transform: scale(.06); pointer-events: none; transition: transform .55s cubic-bezier(.2, .9, .25, 1.08), opacity .35s; }
#panel.on { opacity: 1; transform: none; pointer-events: auto; }
.panel-head { display: flex; align-items: center; gap: 1rem; padding: .7rem 1rem; background: var(--warna); color: #fff; flex: none; }
.panel-ikon { width: 3.1rem; height: 3.1rem; border-radius: 50%; background: rgba(255, 255, 255, .22); display: grid; place-items: center; }
.panel-ikon .ic { width: 58%; height: 58%; }
.panel-jejak { flex: 1; font-size: 1.45rem; font-weight: 900; display: flex; align-items: center; gap: .6rem; min-width: 0; overflow: hidden; white-space: nowrap; }
.panel-jejak span { opacity: .75; } .panel-jejak .aktif { opacity: 1; overflow: hidden; text-overflow: ellipsis; } .panel-jejak .sep { opacity: .5; }
.panel-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 1.4rem 2rem 2rem; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.view { animation: masukGeser .4s both; min-height: 100%; display: flex; flex-direction: column; }
.view > * { flex: none; }
.judul-seksi { display: flex; align-items: center; gap: .6rem; margin: 1.4rem 0 .9rem; font-size: 1.35rem; }
.judul-seksi .ic { color: var(--oranye); }

/* ---------- Kartu & grid ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(19rem, 100%), 1fr)); gap: 1.2rem; }
.card { position: relative; overflow: hidden; text-align: left; background: #fff; border-radius: var(--r); padding: 1.3rem 1.4rem; box-shadow: var(--bayang); border: 3px solid transparent; display: flex; flex-direction: column; gap: .4rem; transition: transform .18s, border-color .18s; }
.card:active { transform: scale(.97); }
.card h3 { font-size: 1.3rem; margin: .2rem 0; }
.card p { color: var(--teks2); margin: 0; font-size: .98rem; }
.masuk { animation: masukAtas .45s both; }

/* Belajar */
.materi-grid { grid-template-columns: repeat(auto-fill, minmax(min(21rem, 100%), 1fr)); }
.materi-card { border-top: .5rem solid var(--c); }
.materi-ilus { background: var(--krem); border-radius: 1rem; margin-bottom: .4rem; aspect-ratio: 600 / 420; overflow: hidden; }
.materi-ilus svg { width: 100%; height: 100%; display: block; }
.mapel-chip { align-self: flex-start; color: #fff; font-weight: 800; font-size: .8rem; padding: .2rem .8rem; border-radius: 999px; }
.slides { height: 100%; gap: 1rem; }
.slide-kepala { display: flex; align-items: center; gap: 1rem; font-size: 1.2rem; }
.slide-panggung { position: relative; flex: 1 1 auto !important; min-height: 26rem; overflow: hidden; border-radius: 1.4rem; background: #fff; box-shadow: var(--bayang); touch-action: pan-y; }
.slide { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1.05fr; gap: 2rem; align-items: center; padding: 2rem 2.4rem; transition: transform .55s cubic-bezier(.3, .9, .3, 1), opacity .45s; }
.slide.kiri { transform: translateX(-12%); opacity: 0; pointer-events: none; }
.slide.kanan { transform: translateX(12%); opacity: 0; pointer-events: none; }
.slide-no { font-weight: 800; color: var(--aksen); font-size: .95rem; }
.slide-teks h2 { font-size: 2.2rem; font-weight: 900; margin-top: .3rem; }
.slide-isi { font-size: 1.3rem; }
.slide-isi ol, .slide-isi ul { padding-left: 1.3em; margin: .3em 0; } .slide-isi li { margin: .25em 0; }
.slide-isi .contoh { background: var(--krem); border-left: .4rem solid var(--aksen); padding: .6rem 1rem; border-radius: .6rem; font-size: 1.15rem; }
.slide-ilus { height: 100%; display: grid; place-items: center; }
.slide-ilus svg { width: 100%; max-height: 100%; }
.kode { font-family: "Cascadia Code", Consolas, "Courier New", monospace; }
pre.kode { background: var(--navy); color: #E8F1FF; padding: 1rem 1.2rem; border-radius: .9rem; font-size: 1rem; white-space: pre-wrap; margin: .3em 0 .7em; }
.slide-kaki { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.slide-titik { display: flex; gap: .3rem; }
.dot { width: 48px; height: 48px; display: grid; place-items: center; }
.dot::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--garis); transition: all .3s; }
.dot.on::before { width: 36px; border-radius: 8px; background: var(--aksen); }
.komik-narasi { font-size: 1.35rem; }
.balon { position: relative; background: var(--krem); border: 3px solid var(--navy); border-radius: 1.4rem; padding: 1rem 1.3rem; font-size: 1.5rem; font-weight: 800; margin: .8rem 0 1rem; }
.balon::after { content: ""; position: absolute; left: 2rem; top: 100%; border: 14px solid transparent; border-top-color: var(--navy); }
.ilus text:not([fill]) { fill: var(--navy); }

/* Bermain */
.game-grid { grid-template-columns: repeat(auto-fill, minmax(min(17rem, 100%), 1fr)); }

.game-ikon { width: 4.2rem; height: 4.2rem; border-radius: 1.2rem; background: var(--c, var(--teal)); color: #fff; display: grid; place-items: center; margin-bottom: .4rem; }

.skor-tb { margin-top: auto; font-weight: 800; font-size: .9rem; color: var(--c, var(--teal)); background: var(--krem); padding: .2rem .8rem; border-radius: 999px; }
.game-kepala h2 { font-size: 1.8rem; margin-bottom: .2rem; } .game-kepala p { color: var(--teks2); font-size: 1.1rem; }
.urut-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6rem; margin-top: 1rem; }
.urut-slot, .urut-kolam { display: flex; flex-direction: column; gap: .7rem; }
.slot { position: relative; overflow: hidden; display: flex; align-items: center; gap: 1rem; min-height: 4.4rem; padding: .5rem 1rem; border-radius: 1rem; border: 3px dashed #CDBFA6; background: rgba(255, 255, 255, .6); text-align: left; font-size: 1.1rem; font-weight: 700; transition: all .25s; }

.slot.isi { border-style: solid; border-color: var(--teal); background: #fff; animation: pop .3s; }

.slot.benar { border-color: var(--benar); background: #E6F9EE; }
.slot.salah { border-color: var(--salah); background: #FDE7E5; animation: getar .45s; }
.kartu-urut { position: relative; overflow: hidden; min-height: 4.4rem; padding: .7rem 1.2rem; border-radius: 1rem; background: #fff; box-shadow: var(--bayang); text-align: left; font-size: 1.1rem; font-weight: 700; border-left: .5rem solid var(--oranye); }
.kartu-urut:active { transform: scale(.97); }
.kolam-kosong { display: flex; align-items: center; gap: .6rem; justify-content: center; min-height: 6rem; color: var(--teal); font-weight: 800; border: 3px dashed var(--teal); border-radius: 1rem; }
.jodoh-info { display: flex; gap: 2rem; font-size: 1.15rem; margin: .4rem 0 1rem; }
.jodoh-wrap { display: grid; grid-template-columns: .8fr 1.2fr; gap: 2rem; }
.jodoh-kol { display: flex; flex-direction: column; gap: .8rem; }
.jodoh-btn { position: relative; display: flex; align-items: center; gap: .8rem; min-height: 4.4rem; padding: .6rem 1.2rem; border-radius: 1rem; background: #fff; box-shadow: var(--bayang); border: 3px solid transparent; font-size: 1.15rem; font-weight: 800; text-align: left; transition: all .2s; }
.jodoh-kol.arti .jodoh-btn { font-weight: 600; font-size: 1.05rem; }
.jodoh-btn.pilih { border-color: var(--navy); transform: scale(1.03); background: #EEF4FF; }
.jodoh-btn.cocok { border-color: var(--w); background: color-mix(in srgb, var(--w) 14%, #fff); animation: pop .35s; cursor: default; }
.jodoh-btn.salah { border-color: var(--salah); animation: getar .45s; }
.lencana { width: 2rem; height: 2rem; border-radius: 50%; background: var(--w); color: #fff; display: grid; place-items: center; font-size: .9rem; flex: none; }
.hud { display: flex; align-items: center; justify-content: space-between; gap: 1.4rem; font-size: 1.2rem; font-weight: 700; margin: .4rem 0 .9rem; flex-wrap: wrap; }
.hud > span { display: inline-flex; align-items: center; gap: .5rem; }
.hud .ic { color: var(--oranye); }
.hud .aksi { margin: 0; }
.waktu-bar { flex: 1; height: 1.1rem; background: var(--garis); border-radius: 999px; overflow: hidden; min-width: 8rem; }
.waktu-isi { height: 100%; background: linear-gradient(90deg, var(--koral), var(--oranye)); transform-origin: left; }
.arena { position: relative; flex: 1 1 auto !important; min-height: 30rem; border-radius: 1.4rem; overflow: hidden; touch-action: none; }

.tengah-arena { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; }
.tengah-arena:active { transform: translate(-50%, -50%) scale(.96) !important; }
.kartu-jatuh { position: absolute; left: 0; top: 0; min-width: 11rem; min-height: 4.2rem; padding: .5rem 1.1rem; border-radius: 1rem; background: #fff; border: 3px solid var(--navy2); box-shadow: var(--bayang); font-family: Consolas, "Courier New", monospace; font-weight: 700; font-size: 1.1rem; text-align: left; will-change: transform; }
.kartu-jatuh small { display: block; font-family: var(--font); font-size: .7rem; color: var(--teks2); letter-spacing: .1em; }
.kartu-jatuh.kena { background: var(--benar); color: #fff; border-color: var(--benar); transition: opacity .35s; opacity: 0; }
.kartu-jatuh.keliru { background: var(--salah); color: #fff; border-color: var(--salah); transition: opacity .35s; opacity: 0; }
.angka-terbang { position: absolute; font-size: 2rem; font-weight: 900; color: #1E8E4E; animation: terbang .9s forwards; pointer-events: none; z-index: 4; }

.target { position: absolute; left: 0; top: 0; width: 190px; height: 112px; will-change: transform; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .35)); cursor: none; }

.bidik { position: absolute; left: 0; top: 0; width: 60px; height: 60px; pointer-events: none; z-index: 2; }
.tembak-arena::after { content: ""; position: absolute; inset: 0; z-index: 4; background: rgba(13, 27, 52, .55); opacity: 0; pointer-events: none; transition: opacity .3s; }
.tembak-arena.jeda::after { opacity: 1; }
.tembak-arena.jeda .target { filter: blur(3px); }
.tembak-soal { position: absolute; inset: 8% 10%; z-index: 5; background: #fff; border-radius: 1.4rem; padding: 2rem; box-shadow: var(--bayang-kuat); display: flex; flex-direction: column; justify-content: center; gap: 1rem; animation: muncul .35s both; cursor: default; }

.opsi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1rem; }
.hasil { margin: auto; text-align: center; max-width: 52rem; padding: 1rem 0; animation: muncul .5s both; }

.bintang { display: flex; justify-content: center; gap: 1rem; margin-bottom: .6rem; }

.bintang span.on .ic { fill: var(--emas); stroke: #C99A2E; }
.skor-besar b { font-size: 5rem; font-weight: 900; color: var(--teal); } .skor-besar small { font-size: 1.6rem; color: var(--teks2); font-weight: 800; }

.rincian-kumpul { display: grid; gap: 1rem; text-align: left; background: #fff; padding: 1.2rem; border-radius: 1rem; margin: 1rem 0; }

/* Kuis */
.paket-grid { grid-template-columns: repeat(auto-fill, minmax(min(20rem, 100%), 1fr)); }
.paket-card { border-left: .55rem solid var(--c); min-height: 21rem; padding: 1.8rem; }
.q-prog { display: flex; gap: .45rem; margin-bottom: 1.2rem; }
.q-prog span { flex: 1; height: .8rem; border-radius: 999px; background: var(--garis); transition: background .3s; }

.q-prog span.ok { background: var(--benar); } .q-prog span.no { background: var(--salah); }
.q-wrap { max-width: 74rem; width: 100%; margin: 0 auto; }
.q-no { font-weight: 800; color: var(--teal); font-size: 1.05rem; }
.q-text { font-size: 2rem; font-weight: 900; margin: .3rem 0 1.3rem; line-height: 1.25; }
.opsi-list { display: grid; gap: .9rem; }
.opt { position: relative; overflow: hidden; display: flex; align-items: center; gap: 1.1rem; min-height: 4.8rem; padding: .7rem 1.3rem; border-radius: 1.1rem; background: #fff; border: 3px solid var(--garis); font-size: 1.3rem; font-weight: 700; text-align: left; transition: border-color .2s, background .2s, transform .15s; }
.opt:active { transform: scale(.98); }
.opt .huruf, .huruf { width: 3rem; height: 3rem; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 900; flex: none; }
.opt.benar { border-color: var(--benar); background: #E3F8EC; animation: pop .35s; } .opt.benar .huruf { background: var(--benar); }
.opt.salah { border-color: var(--salah); background: #FDE7E5; animation: getar .45s; } .opt.salah .huruf { background: var(--salah); }
.opt.mati { pointer-events: none; }
.bahas { max-height: 0; overflow: hidden; opacity: 0; transition: all .4s; border-radius: 1rem; font-size: 1.15rem; }
.bahas.on { max-height: 14rem; opacity: 1; padding: 1rem 1.3rem; margin-top: 1rem; }
.bahas.ok { background: #E3F8EC; border-left: .5rem solid var(--benar); } .bahas.no { background: #FFF1E3; border-left: .5rem solid var(--oranye); }
.rekap-atas { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin: .4rem 0 .8rem; }
.rekap-atas h3 { margin: 0; }
.rekap-atas .aksi { margin: 0; }
.grafik-wadah { position: relative; background: #fff; border-radius: 1.2rem; box-shadow: var(--bayang); padding: .4rem; margin-bottom: 1.2rem; }
canvas.grafik { display: block; width: 100%; height: 50vh; min-height: 18rem; }
canvas.grafik.kecil { height: 30vh; min-height: 15rem; }
.grafik-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(32rem, 100%), 1fr)); gap: 1rem; }
.seg { display: inline-flex; background: #fff; border-radius: 1rem; padding: .3rem; box-shadow: var(--bayang); gap: .3rem; }
.seg button { min-height: max(56px, 2.6rem); padding: 0 1.2rem; border-radius: .8rem; font-weight: 800; }
.seg button.on { background: var(--navy); color: #fff; }
.tabel { width: 100%; border-collapse: collapse; background: #fff; border-radius: 1rem; overflow: hidden; margin-top: .6rem; }
.tabel th, .tabel td { padding: .6rem 1rem; text-align: left; border-bottom: 1px solid var(--garis); }
.tabel th { background: var(--navy); color: #fff; }
details.lipat summary, details.soal-ed summary { cursor: pointer; font-weight: 800; min-height: var(--sentuh); display: flex; align-items: center; gap: .4rem; padding: 0 1rem; background: #fff; border-radius: 1rem; box-shadow: var(--bayang); }
.kosong-besar { margin: auto; text-align: center; max-width: 36rem; padding: 2rem; color: var(--teks2); display: flex; flex-direction: column; align-items: center; gap: .4rem; }
.kosong-besar > .ikw .ic { width: 5rem; height: 5rem; color: var(--oranye); }
.kosong-besar h3 { color: var(--navy); font-size: 1.6rem; }

/* Sertifikat */
.sert-wrap { display: grid; grid-template-columns: 1.6fr 1fr; gap: 2rem; align-items: center; margin: auto 0; }
.sert-bingkai { background: #fff; padding: .8rem; border-radius: 1.2rem; box-shadow: var(--bayang-kuat); animation: muncul .6s both; }
canvas.sertifikat { width: 100%; height: auto; display: block; border-radius: .6rem; }

.sert-skor small { display: block; color: var(--teks2); font-weight: 700; } .sert-skor b { font-size: 2.4rem; color: var(--koral); }

/* Lab Maya */
.lab-card { border: 3px solid transparent; padding-top: 1.1rem; }
.lab-card.hari-ini { border-color: var(--oranye); box-shadow: 0 0 0 .35rem rgba(244, 162, 97, .25), var(--bayang); }

.lab-atas { display: flex; align-items: center; gap: .7rem; }
.lab-ikon { width: 3.2rem; height: 3.2rem; border-radius: 1rem; background: var(--navy); color: #fff; display: grid; place-items: center; }
.lab-ikon .ic { width: 55%; height: 55%; }
.lab-atas .kode, .lab-ed .kode { font-weight: 900; background: var(--krem); padding: .2rem .7rem; border-radius: .6rem; font-family: var(--font); }
.lab-atas .status { margin-left: auto; }
.lab-bawah { display: flex; justify-content: space-between; gap: 1rem; margin-top: auto; padding-top: .5rem; font-size: .88rem; font-weight: 700; color: var(--teks2); }

.pita-hari { position: absolute; top: 1.1rem; right: -2.6rem; transform: rotate(35deg); background: var(--oranye); color: var(--navy); font-weight: 900; font-size: .72rem; padding: .25rem 3rem; }

/* Alun-alun */
.dugaan-hero { display: flex; align-items: center; justify-content: space-between; gap: 2rem; flex-wrap: wrap; background: #fff; border-radius: 1.4rem; padding: 1.5rem 1.8rem; box-shadow: var(--bayang); }

.daftar-dugaan small { display: block; font-weight: 600; color: var(--teks2); }
.sesi-list { display: grid; gap: .7rem; }
.sesi-item { display: flex; align-items: center; gap: 1rem; background: #fff; border-radius: 1rem; padding: .6rem 1rem; box-shadow: var(--bayang); text-align: left; width: 100%; min-height: var(--sentuh); }
.sesi-item > div { flex: 1; } .sesi-item small { display: block; color: var(--teks2); }
.sesi-label { background: var(--oranye); color: var(--navy); font-weight: 900; padding: .3rem .9rem; border-radius: .7rem; }
.dugaan-panggung { flex: 1 1 auto !important; display: flex; flex-direction: column; justify-content: center; padding: 1rem 0; }
.q-text.tengah { text-align: center; font-size: 2.5rem; max-width: 70rem; margin: .5rem auto 2rem; }
.q-no { text-align: inherit; }
.dugaan-panggung .q-no { text-align: center; }
.pilih-besar { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 1.2rem; }
.pilih-btn { position: relative; overflow: hidden; min-height: 9rem; border-radius: 1.4rem; background: var(--c); color: #fff; font-size: 1.7rem; font-weight: 900; padding: 1rem; box-shadow: 0 .5rem 0 color-mix(in srgb, var(--c) 70%, #000), var(--bayang); transition: transform .12s, box-shadow .12s; display: flex; align-items: center; justify-content: center; gap: .8rem; text-shadow: 0 2px 0 rgba(0, 0, 0, .15); }
.pilih-btn:active, .pilih-btn.dipilih { transform: translateY(.4rem); box-shadow: 0 .1rem 0 color-mix(in srgb, var(--c) 70%, #000); }
.pilih-btn.dipilih { animation: pop .3s; filter: brightness(1.1); }
.pilih-btn .huruf { background: rgba(255, 255, 255, .25); }
.terima-kasih { text-align: center; animation: muncul .5s both; display: flex; flex-direction: column; align-items: center; gap: .5rem; }
.cek-besar { width: 8rem; height: 8rem; border-radius: 50%; background: var(--benar); color: #fff; display: grid; place-items: center; animation: pop .5s; }
.cek-besar .ic { width: 60%; height: 60%; }
.terima-kasih h2 { font-size: 3rem; }
.banding-atas { display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.banding-atas label { display: grid; gap: .3rem; font-weight: 800; min-width: 18rem; }
.vs { font-weight: 900; font-size: 1.4rem; color: var(--koral); padding-bottom: 1rem; }
.temuan-grid { grid-template-columns: repeat(auto-fill, minmax(min(18rem, 100%), 1fr)); margin-top: 1rem; }
.temuan-card { padding: .8rem; }
.temuan-card h3, .temuan-card p { padding: 0 .4rem; }
.temuan-card p { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.temuan-gambar { aspect-ratio: 4 / 3; border-radius: .9rem; overflow: hidden; background: var(--krem); display: grid; place-items: center; }
.temuan-gambar img { width: 100%; height: 100%; object-fit: cover; }
.temuan-ikon { width: 45%; color: var(--teal); }
.temuan-ikon .ic { width: 100%; height: auto; }
.temuan-ikon.besar { width: 40%; }
.p-badge { position: absolute; top: 1.2rem; left: 1.2rem; background: var(--navy); color: #fff; font-weight: 900; font-size: .85rem; padding: .2rem .7rem; border-radius: .6rem; }
.lb-teks .p-badge { position: static; display: inline-block; margin-bottom: .6rem; }
#lightbox { position: fixed; inset: 0; z-index: 59; background: rgba(15, 25, 45, .88); display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .3s; }
#lightbox.on { opacity: 1; pointer-events: auto; }
.lb-isi { width: 90vw; height: 84vh; display: grid; grid-template-columns: 1.6fr 1fr; gap: 2rem; background: var(--krem); border-radius: 1.6rem; padding: 1.6rem; animation: muncul .35s both; }
.lb-gambar { border-radius: 1rem; overflow: hidden; background: #fff; display: grid; place-items: center; }

.lb-prev { left: 1vw; } .lb-next { right: 1vw; }
.voting-setup { display: grid; grid-template-columns: 1.5fr 1fr; gap: 2rem; align-items: start; }
.voting-setup > .form { background: #fff; padding: 1.5rem 1.8rem; border-radius: 1.4rem; box-shadow: var(--bayang); }
.opsi-edit { display: grid; gap: .6rem; }
.opsi-baris { display: flex; align-items: center; gap: .7rem; }
.riwayat-vote { display: grid; gap: .7rem; }
.riwayat-vote h3 { display: flex; align-items: center; gap: .5rem; }
.vote-tanya { font-size: 2.2rem; font-weight: 900; text-align: center; margin: .3rem auto 1.2rem; max-width: 70rem; }
.pilih-besar.vote .pilih-btn { min-height: 7rem; font-size: 1.5rem; }
.vote-grafik canvas.grafik { height: 36vh; }
.tirai { position: absolute; inset: 0; border-radius: 1.2rem; background: repeating-linear-gradient(45deg, #FFF8EE, #FFF8EE 20px, #FBEBD3 20px, #FBEBD3 40px); display: none; flex-direction: column; align-items: center; justify-content: center; gap: .3rem; font-size: 1.3rem; color: var(--teks2); }

.view.terima .pilih-besar { pointer-events: none; }

/* ---------- Modal, toast, konfeti ---------- */
#modal { position: fixed; inset: 0; z-index: 60; background: rgba(15, 25, 45, .55); display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .25s; padding: 2vh 2vw; }
#modal.on { opacity: 1; pointer-events: auto; }
.modal-box { width: min(46rem, 94vw); max-height: 92vh; display: flex; flex-direction: column; background: var(--krem); border-radius: 1.6rem; box-shadow: var(--bayang-kuat); transform: scale(.9); transition: transform .3s cubic-bezier(.3, 1.4, .5, 1); overflow: hidden; }

#modal.on .modal-box { transform: none; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.2rem 1rem 1.8rem; background: #fff; }
.modal-head h2 { margin: 0; font-size: 1.6rem; }
.modal-isi { padding: 1.4rem 1.8rem; overflow: auto; font-size: 1.1rem; }
.modal-aksi { display: flex; justify-content: flex-end; gap: .8rem; padding: 0 1.8rem 1.4rem; }
.grid-info { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
.tile { position: relative; overflow: hidden; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 1rem; align-items: center; text-align: left; background: #fff; border-radius: 1.2rem; padding: 1.1rem 1.3rem; box-shadow: var(--bayang); min-height: 6rem; }
.tile-ikon { grid-row: span 2; width: 3.6rem; height: 3.6rem; border-radius: 1rem; background: var(--teal); color: #fff; display: grid; place-items: center; }
.tile-ikon.kecil { width: 2.8rem; height: 2.8rem; }
.tile-ikon .ic { width: 55%; height: 55%; }
.tile b { font-size: 1.25rem; } .tile small { color: var(--teks2); }
.info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; margin-bottom: 1.2rem; }
.info-sel { background: #fff; padding: .7rem 1rem; border-radius: 1rem; } .info-sel small { display: block; color: var(--teks2); font-weight: 700; } .info-sel b { font-size: 1.15rem; }
.tp-list { display: grid; gap: .7rem; }
.tp { background: #fff; border-left: .5rem solid var(--c); padding: .8rem 1.1rem; border-radius: .9rem; } .tp p { margin: .2rem 0 0; }
.profil { display: grid; grid-template-columns: 9rem 1fr; gap: 1.6rem; align-items: center; }
.profil-foto svg { width: 100%; }
ol.pustaka { padding-left: 1.4rem; display: grid; gap: .6rem; user-select: text; }
.lkpd-list { display: grid; gap: .7rem; }
.lkpd { display: flex; align-items: center; gap: 1rem; background: #fff; padding: .7rem 1rem; border-radius: 1rem; }
.lkpd > div { flex: 1; } .lkpd small { display: block; color: var(--teks2); }
#toast { position: fixed; left: 50%; bottom: 3vh; opacity: 0; transform: translate(-50%, calc(100% + 4vh)); z-index: 90; background: var(--navy); color: #fff; padding: .9rem 1.6rem; border-radius: 1rem; font-weight: 700; font-size: 1.1rem; max-width: 80vw; box-shadow: var(--bayang-kuat); transition: transform .35s cubic-bezier(.3, 1.4, .5, 1), opacity .3s; pointer-events: none; }
#toast.on { transform: translate(-50%, 0); opacity: 1; }
#toast.warn { background: var(--koral); } #toast.ok { background: var(--teal); }
#confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 95; display: none; }
#confetti.on { display: block; }

/* ---------- Roda gigi & Panel Guru ---------- */
#gear { position: fixed; top: calc((var(--bar) - var(--sentuh)) / 2); right: 1.2rem; z-index: 58; width: var(--sentuh); height: var(--sentuh); border-radius: 50%; background: #fff; color: var(--teks2); display: grid; place-items: center; box-shadow: var(--bayang); touch-action: none; }
#gear > .ic { width: 50%; height: 50%; transition: transform 2s linear; }
.gear-cincin { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.gear-cincin circle { stroke-dasharray: 183; stroke-dashoffset: 183; transition: stroke-dashoffset .2s; }
#gear.tahan .gear-cincin circle { stroke-dashoffset: 0; transition: stroke-dashoffset 2s linear; }
#gear.tahan > .ic { transform: rotate(180deg); color: var(--oranye); }
#guru { position: fixed; inset: 0; z-index: 57; background: rgba(15, 25, 45, .5); display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .3s; }
#guru.on { opacity: 1; pointer-events: auto; }
.guru-box { width: 94vw; height: 90vh; background: var(--krem); border-radius: 1.6rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--bayang-kuat); }
.guru-head { display: flex; align-items: center; gap: 1rem; padding: .8rem 1.4rem; background: var(--navy); color: #fff; padding-right: calc(var(--sentuh) + 2.6rem); }
.guru-head h2 { margin: 0; flex: 1; }
.guru-head > .ikw .ic { width: 2rem; height: 2rem; color: var(--oranye); }
.guru-tubuh { flex: 1; display: grid; grid-template-columns: 17rem 1fr; min-height: 0; }
.guru-nav { background: #fff; padding: 1rem; display: flex; flex-direction: column; gap: .4rem; overflow: auto; }
.guru-nav button { display: flex; align-items: center; gap: .7rem; min-height: var(--sentuh); padding: 0 1rem; border-radius: .9rem; font-weight: 800; text-align: left; }
.guru-nav button.on { background: var(--teal); color: #fff; }
.guru-isi { overflow: auto; padding: 1.4rem 2rem 3rem; }
.guru-isi h3 { margin-top: 1.4rem; }
.pert-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: .7rem; }
.pert-btn { display: flex; flex-direction: column; align-items: flex-start; gap: .1rem; text-align: left; background: #fff; border: 3px solid var(--garis); border-radius: 1rem; padding: .7rem .8rem; min-height: 7rem; }
.pert-btn b { font-size: 1.3rem; } .pert-btn small { font-weight: 800; color: var(--teal); } .pert-btn span { font-size: .8rem; color: var(--teks2); line-height: 1.25; }
.pert-btn.on { border-color: var(--oranye); background: #FFF1E3; box-shadow: 0 0 0 .3rem rgba(244, 162, 97, .3); }
details.soal-ed { margin-bottom: .7rem; }
details.soal-ed summary { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: block; line-height: var(--sentuh); }
details.soal-ed[open] summary { white-space: normal; line-height: 1.3; padding: .9rem 1rem; }
details.soal-ed .form { background: #fff; padding: 1rem 1.2rem; border-radius: 0 0 1rem 1rem; margin-top: -.6rem; padding-top: 1.4rem; }
.opsi-ed { display: grid; gap: .5rem; }
label.opsi-baris { display: flex !important; align-items: center; gap: .7rem; }
.ed-blok { background: #fff; padding: 1.2rem 1.4rem; border-radius: 1.2rem; box-shadow: var(--bayang); margin-bottom: 1.2rem; }
textarea.kode-ed { font-family: Consolas, "Courier New", monospace; font-size: .95rem; }
.ed-pesan { font-weight: 800; margin-top: .4rem; } .ed-pesan.ok { color: #1E8E4E; } .ed-pesan.no { color: var(--salah); }
.tabel-ed { display: grid; gap: .6rem; }
.lab-ed { display: grid; grid-template-columns: auto 1fr 1.2fr auto; gap: 1rem; align-items: center; background: #fff; padding: .5rem 1rem; border-radius: 1rem; }
.lab-ed small { color: var(--teks2); }
.saklar { display: flex; align-items: center; gap: .5rem; font-weight: 800; min-height: var(--sentuh); }
.pratinjau { width: 14rem; aspect-ratio: 4 / 3; background: var(--krem2); border-radius: 1rem; overflow: hidden; display: grid; place-items: center; color: var(--teks2); flex: none; }
.pratinjau img { width: 100%; height: 100%; object-fit: cover; }
.form-gambar { display: flex; gap: 1.2rem; align-items: center; }
.form-gambar > div { display: flex; flex-wrap: wrap; gap: .6rem; }

/* ---------- Animasi ---------- */
@keyframes denyut { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@keyframes riak { to { transform: scale(2.4); opacity: 0; } }
@keyframes muncul { from { opacity: 0; transform: translateY(24px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes masukGeser { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
@keyframes masukAtas { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
@keyframes getar { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
@keyframes sinar { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
@keyframes lompat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes putar { to { transform: rotate(360deg); } }
@keyframes kedip { 50% { opacity: .25; } }
@keyframes kibar { from { transform: skewY(-8deg); } to { transform: skewY(8deg) scaleX(.85); } }
@keyframes gelombang { 0% { opacity: .9; transform: scale(.4); } 100% { opacity: 0; transform: scale(5); } }
@keyframes awan { from { translate: -40px 0; } to { translate: 60px 0; } }
@keyframes alir { to { stroke-dashoffset: -40; } }
@keyframes terbang { to { transform: translateY(-80px); opacity: 0; } }
@keyframes meledak { to { transform: var(--t, none) scale(1.6); opacity: 0; } }
@keyframes ledak { to { width: 220px; height: 220px; margin: -110px; opacity: 0; } }
@keyframes bintang { from { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.2); } to { transform: none; } }

/* ---------- Penyesuaian layar ---------- */
.isi-nama-baris { display: flex; gap: .8rem; width: min(36rem, 100%); margin: .6rem auto 1rem; }
.isi-nama-baris .inp { flex: 1; min-width: 0; }
@media (max-aspect-ratio: 4/3) {
  .judul-kartu { width: min(44rem, 88vw); margin: auto; }
  #scr-judul svg.city { left: 0; width: 100%; opacity: .45; }
  .identitas-wrap { grid-template-columns: 1fr; } .identitas-ilus { display: none; }
  .slide { grid-template-columns: 1fr; grid-template-rows: auto 1fr; padding: 1.4rem; }
  .urut-wrap, .jodoh-wrap, .sert-wrap, .voting-setup, .lb-isi { grid-template-columns: 1fr; }
  .rb-tahap { display: none; }
  .pert-grid { grid-template-columns: repeat(3, 1fr); }
  .guru-tubuh { grid-template-columns: 1fr; } .guru-nav { flex-direction: row; overflow-x: auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* =====================================================================
   Gaya bersama media Lab Maya (A1–A7, G1–G4)
   ===================================================================== */
.lab-app { background: linear-gradient(180deg, #E3F3F6 0%, var(--krem) 45%); }
.mode-seg { margin-left: 1rem; }
.mode-seg button { font-size: 1.05rem; display: inline-flex; align-items: center; gap: .4rem; }
.jml:not(:empty) { background: var(--koral); color: #fff; border-radius: 999px; padding: 0 .55rem; font-size: .8rem; line-height: 1.6; }
a.iconbtn { text-decoration: none; }
.lab-main { flex: 1; min-height: 0; position: relative; }
.mode { position: absolute; inset: 1.1rem 1.4rem 1.2rem; display: none; flex-direction: column; min-height: 0; }
.mode.on { display: flex; animation: masukAtas .4s both; }
.intro { position: fixed; inset: 0; z-index: 70; background: radial-gradient(circle at 30% 30%, #E5F5F2, #FFF8EE 60%); display: none; place-items: center; padding: 2vh 2vw; }
.intro.on { display: grid; }
.intro-kartu { display: grid; grid-template-columns: .8fr 1.2fr; gap: 2.4rem; align-items: center; width: min(92vw, 84rem); background: #fff; border-radius: 2rem; padding: 2.4rem 2.8rem; box-shadow: var(--bayang-kuat); animation: muncul .6s both; }
.intro-kartu h1 { font-size: 4.2rem; font-weight: 900; margin: .5rem 0 .3rem; }
.intro-ilus svg { width: 100%; }
.intro-catatan { display: flex; gap: 1rem; align-items: center; background: #EAF6F4; border-left: .6rem solid var(--teal); padding: 1rem 1.2rem; border-radius: 1rem; font-size: 1.1rem; margin: 1rem 0; }
.intro-catatan .ic { width: 2.2rem; height: 2.2rem; color: var(--teal); }
.pojok-catatan { position: absolute; z-index: 4; background: rgba(255, 255, 255, .9); color: var(--navy); font-weight: 800; font-size: .85rem; padding: .3rem .8rem; border-radius: 999px; box-shadow: var(--bayang); pointer-events: none; }
.slider-baris { display: flex; align-items: center; gap: 1rem; }
input[type=range].geser { -webkit-appearance: none; appearance: none; flex: 1; height: 14px; border-radius: 999px; background: linear-gradient(90deg, var(--koral) var(--isi, 0%), var(--garis) var(--isi, 0%)); outline: none; }
input[type=range].geser::-webkit-slider-thumb { -webkit-appearance: none; width: 48px; height: 48px; border-radius: 50%; background: #fff; border: 6px solid var(--koral); box-shadow: var(--bayang); cursor: grab; }
input[type=range].geser::-moz-range-thumb { width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 6px solid var(--koral); cursor: grab; }
@media (max-aspect-ratio: 4/3) { .intro-kartu { grid-template-columns: 1fr; } .mode { overflow: auto; } }

/* =====================================================================
   Gaya bersama permainan Duel 2 Tim (G1–G4)
   ===================================================================== */
:root { --merah: #E63946; --biru: #2F6FDB; --merah-muda: #FDE4E6; --biru-muda: #E1EBFC; }

/* ---------- Sampul ---------- */
.duel-sampul { overflow: hidden; display: grid; place-items: center; }
.st-latar { position: absolute; inset: 0; overflow: hidden; }
.st-belah { position: absolute; top: -10%; bottom: -10%; width: 60%; }
.st-belah.kiri { left: -10%; background: linear-gradient(135deg, #F7A1A8, var(--merah)); transform: skewX(-8deg); animation: masukKiri .9s cubic-bezier(.2, .9, .3, 1.1) both; }
.st-belah.kanan { right: -10%; background: linear-gradient(225deg, #9CBCF3, var(--biru)); transform: skewX(-8deg); animation: masukKanan .9s cubic-bezier(.2, .9, .3, 1.1) both; }
.st-kilat { position: absolute; left: 50%; top: -10%; bottom: -10%; width: 1.2rem; background: #FFF8EE; transform: translateX(-50%) skewX(-8deg); box-shadow: 0 0 2rem #fff; animation: sinar 2.4s ease-in-out infinite; }
@keyframes masukKiri { from { transform: translateX(-60%) skewX(-8deg); } }
@keyframes masukKanan { from { transform: translateX(60%) skewX(-8deg); } }
.duel-sampul .judul-alat { right: calc(var(--sentuh) + 2.4rem); }
.st-kartu { position: relative; z-index: 2; width: min(58rem, 90vw); background: rgba(255, 255, 255, .95); border-radius: 2.2rem; padding: 2rem 2.6rem 1.4rem; box-shadow: var(--bayang-kuat); text-align: center; animation: muncul .8s .2s cubic-bezier(.2, .9, .3, 1.2) both; }
.st-ikon { width: 7rem; height: 7rem; margin: -5.5rem auto .3rem; background: #fff; border-radius: 50%; box-shadow: var(--bayang); display: grid; place-items: center; }
.st-ikon svg { width: 82%; height: 82%; }
.st-tag { display: inline-block; font-weight: 900; color: #fff; background: var(--navy); padding: .25rem 1rem; border-radius: 999px; font-size: .95rem; letter-spacing: .06em; text-transform: uppercase; }
.st-kartu h1 { font-size: 4.4rem; font-weight: 900; margin: .3rem 0 .1rem; letter-spacing: -.01em; }
.st-sub { font-size: 1.2rem; color: var(--teks2); margin: 0 auto 1rem; max-width: 46rem; }
.st-tim-baris { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: center; margin-bottom: 1rem; }
.st-tim { display: flex; flex-direction: column; gap: .3rem; background: color-mix(in srgb, var(--c) 10%, #fff); border: 4px solid var(--c); border-radius: 1.2rem; padding: .6rem .9rem; text-align: left; }
.st-warna { font-weight: 900; color: var(--c); font-size: .9rem; text-transform: uppercase; letter-spacing: .05em; }
.st-tim .inp { font-weight: 900; font-size: 1.35rem; border-color: transparent; background: rgba(255, 255, 255, .8); }
.st-vs { font-size: 2.4rem; font-weight: 900; color: var(--oranye); text-shadow: 0 .2rem 0 var(--navy); animation: lompat 1.6s ease-in-out infinite; }
.st-opsi-baris { display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
.st-opsi { display: flex; flex-direction: column; align-items: center; gap: .4rem; }
.st-opsi b { color: var(--teks2); }
.st-opsi .seg button { min-width: 5.2rem; font-size: 1.15rem; }
.st-mulai { margin: .2rem auto .8rem; }
.st-kaki { font-size: .85rem; color: var(--teks2); margin: 0; }

/* ---------- Arena ---------- */
.duel-arena { background: linear-gradient(90deg, #FFF0F1 0%, var(--krem) 30%, var(--krem) 70%, #EEF3FD 100%); }
.pil-ronde { display: flex; align-items: center; gap: .6rem; font-weight: 900; font-size: 1.15rem; background: var(--krem); border-radius: 999px; padding: .3rem 1.1rem; }
.titik-ronde { display: flex; gap: .3rem; }
.titik-ronde i { width: .75rem; height: .75rem; border-radius: 50%; background: var(--garis); display: block; transition: background .3s, transform .3s; }
.titik-ronde i.m { background: var(--merah); } .titik-ronde i.b { background: var(--biru); } .titik-ronde i.s { background: var(--teal); }
.titik-ronde i.kini { transform: scale(1.45); background: var(--oranye); }
.duel-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 21rem 1fr; gap: 1.1rem; padding: 1rem 1.3rem 1.1rem; }
.tim-panel { position: relative; display: flex; flex-direction: column; gap: .8rem; min-height: 0; --c: var(--merah); --cm: var(--merah-muda); }
.tim-panel.biru { --c: var(--biru); --cm: var(--biru-muda); }
.tim-kepala { display: flex; align-items: center; gap: 1rem; background: var(--c); color: #fff; border-radius: 1.3rem; padding: .5rem .6rem .5rem 1.2rem; box-shadow: var(--bayang); min-height: 4.4rem; }
.tim-kepala .tk-nama { font-size: 1.6rem; font-weight: 900; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tim-kepala .tk-status { font-weight: 800; font-size: .95rem; background: rgba(255, 255, 255, .22); padding: .25rem .8rem; border-radius: 999px; white-space: nowrap; }
.tim-kepala .tk-skor { min-width: 5.4rem; height: 3.4rem; border-radius: 1rem; background: #fff; color: var(--c); font-size: 2.3rem; font-weight: 900; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.tim-kepala .tk-skor.pop { animation: pop .5s; }
.tim-panel.kunci .tim-kepala .tk-status { background: #fff; color: var(--c); }

/* timer */
.timer-wadah { width: 9.5rem; height: 9.5rem; margin: 0 auto; }
.timer-cincin { position: relative; width: 100%; height: 100%; }
.timer-cincin svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.tc-latar { fill: #fff; stroke: var(--garis); stroke-width: 9; }
.tc-isi { fill: none; stroke: var(--teal); stroke-width: 9; stroke-linecap: round; transition: stroke .3s; }
.tc-angka { position: absolute; inset: 0; display: grid; place-items: center; font-size: 3.4rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.timer-wadah.kritis .tc-isi { stroke: var(--koral); }
.timer-wadah.kritis .tc-angka { color: var(--koral); animation: pop .5s; }
.timer-wadah.habis .tc-angka { color: var(--teks2); }

/* panji */
.panji { position: absolute; z-index: 6; top: 5.2rem; left: 50%; transform: translateX(-50%); display: flex; align-items: flex-start; pointer-events: none; animation: panjiNaik .6s cubic-bezier(.2, .9, .3, 1.3) both; }
.panji-tiang { width: .7rem; height: 9rem; border-radius: .4rem; background: linear-gradient(90deg, #8D6E4A, #6B4F33); box-shadow: var(--bayang); }
.panji-kain { margin-top: .4rem; background: var(--c); color: #fff; padding: .7rem 2.2rem .7rem 1.2rem; clip-path: polygon(0 0, 100% 0, 88% 50%, 100% 100%, 0 100%); transform-origin: left center; animation: kibar .5s ease-in-out infinite alternate; box-shadow: var(--bayang); display: flex; flex-direction: column; }
.panji-kain b { font-size: 1.6rem; font-weight: 900; white-space: nowrap; }
.panji-kain small { font-weight: 800; font-size: 1rem; opacity: .95; white-space: nowrap; }
@keyframes panjiNaik { from { transform: translate(-50%, 3rem) scale(.6); opacity: 0; } }

.pop-skor { position: fixed; z-index: 80; transform: translate(-50%, 0); font-size: 3rem; font-weight: 900; pointer-events: none; text-shadow: 0 .2rem 0 #fff, 0 0 1rem #fff; animation: skorTerbang 1.4s ease-out both; }
@keyframes skorTerbang { 0% { transform: translate(-50%, 1rem) scale(.4); opacity: 0; } 20% { transform: translate(-50%, 0) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -4rem) scale(1); opacity: 0; } }

.splash { position: fixed; inset: 0; z-index: 75; display: grid; place-items: center; pointer-events: none; background: rgba(29, 53, 87, .25); animation: muncul .3s both; }
.splash > div { background: var(--navy); color: #fff; border-radius: 2rem; padding: 1.4rem 3.4rem; text-align: center; box-shadow: var(--bayang-kuat); animation: bintang .5s cubic-bezier(.2, .9, .3, 1.3) both; }
.splash b { display: block; font-size: 4.4rem; font-weight: 900; line-height: 1.1; }
.splash small { font-size: 1.3rem; font-weight: 800; color: var(--oranye); }
.splash.pergi { opacity: 0; transition: opacity .3s; }

/* ---------- Juara ---------- */
.duel-juara { display: grid; place-items: center; overflow: auto; }
.juara-latar { position: absolute; inset: 0; background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--c) 25%, #fff), var(--krem) 70%); }
.juara-latar::before { content: ""; position: absolute; left: 50%; top: 30%; width: 160vmax; height: 160vmax; margin: -80vmax; background: repeating-conic-gradient(color-mix(in srgb, var(--c) 12%, transparent) 0 10deg, transparent 10deg 20deg); animation: putar 40s linear infinite; }
.juara-kartu { position: relative; z-index: 2; width: min(70rem, 92vw); max-height: 94vh; overflow: auto; background: #fff; border-radius: 2.2rem; padding: 1.4rem 2.4rem 1.6rem; box-shadow: var(--bayang-kuat); text-align: center; animation: muncul .7s cubic-bezier(.2, .9, .3, 1.2) both; }
.juara-piala { width: 7rem; margin: 0 auto; animation: lompat 1.8s ease-in-out infinite; }
.juara-label { font-weight: 900; text-transform: uppercase; letter-spacing: .12em; color: var(--oranye); font-size: 1.3rem; }
.juara-kartu h1 { font-size: 3.6rem; font-weight: 900; margin: .1rem 0 .5rem; }
.juara-skor { display: flex; justify-content: center; align-items: center; gap: 1.4rem; margin-bottom: 1rem; }
.juara-skor > div { min-width: 12rem; border-radius: 1.3rem; background: var(--c); color: #fff; padding: .4rem 1rem; }
.juara-skor small { display: block; font-weight: 800; font-size: 1rem; }
.juara-skor b { font-size: 3.4rem; font-weight: 900; line-height: 1.1; }
.juara-skor > span { font-size: 3rem; font-weight: 900; color: var(--teks2); }
.juara-aksi { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }

/* layar rendah (mis. 1366 × 768): sampul dipadatkan agar muat */
.duel-sampul, .det-sampul, .ba-sampul { overflow-y: auto; }
@media (max-height: 860px) {
  .st-kartu { padding: 1.1rem 2rem .9rem; }
  .st-kartu h1 { font-size: 3rem; }
  .st-ikon { width: 5rem; height: 5rem; margin: -3.6rem auto .2rem; }
  .st-sub { font-size: 1.05rem; margin-bottom: .6rem; }
  .st-tim-baris, .st-opsi-baris { margin-bottom: .6rem; }
  .st-mulai { margin: 0 auto .4rem; }
  .btn.mega.st-mulai { min-height: calc(var(--sentuh) * 1.15); font-size: 1.6rem; }
  .dc-gambar { aspect-ratio: 16 / 7; }
  .juara-kartu { padding: 1rem 2rem 1.2rem; }
  .juara-piala { width: 5rem; }
  .juara-kartu h1 { font-size: 2.8rem; }
}

/* ================= HP (bersama G1–G4) ================= */
@media (max-width: 760px), (max-height: 500px) and (max-width: 1100px) {
  .screen.on:has(.juara-kartu) { display: grid; place-items: start center; padding: 1rem .6rem; }
  .juara-kartu { width: 100%; max-height: none; border-radius: 1.4rem; }
  .juara-piala { width: 4.4rem; }
  .juara-label { font-size: .9rem; }
  .juara-skor { gap: .5rem; }

  .juara-aksi { flex-wrap: wrap; gap: .5rem; }

  .juara-tabel .tabel { display: table; min-width: 32rem; }
}

/* =====================================================================
   LAPISAN HP (dimuat paling akhir di semua media)
   Layar PID/laptop tidak berubah. Di HP (lebar ≤ 760 px) dan HP
   mendatar (tinggi ≤ 500 px) halaman menjadi satu kolom yang dapat
   digulir, bilah atas membungkus, dan target sentuh 44–48 px.
   ===================================================================== */
@media (max-width: 760px), (max-height: 500px) and (max-width: 1100px) {
  html { font-size: 15px; }
  :root { --sentuh: 46px; --bar: 56px; }
  html, body { height: auto; min-height: 100%; }
  body { overflow-x: hidden; overflow-y: auto; -webkit-text-size-adjust: 100%; }
  /* layar aktif ikut alur dokumen agar dapat digulir */
  .screen.on { position: relative; inset: auto; min-height: 100vh; min-height: 100svh; transform: none; }
  .screen:not(.on) { pointer-events: none; }
  /* bilah atas */
  .topbar { height: auto; min-height: var(--bar); flex-wrap: wrap; gap: .4rem; padding: .4rem .6rem; padding-right: calc(46px + 1rem); position: sticky; top: 0; z-index: 40; }
  .topbar .brand { min-width: 0; flex: 1 1 auto; gap: .45rem; }
  .topbar .brand svg { width: 34px; height: 34px; flex: none; }
  .topbar .brand > div { min-width: 0; }
  .topbar .brand b { font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .brand small { font-size: .74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .topbar .spacer { display: none; }
  .topbar .iconbtn, .topbar a.iconbtn { width: 40px; height: 40px; border-radius: .7rem; }
  .topbar .btn-fs { display: none; }
  .topbar .btn.kecil { min-height: 40px; padding: .2rem .7rem; font-size: .85rem; }
  .topbar .gear-ruang { display: none; }
  .topbar .mode-seg, .topbar .seg { order: 20; flex: 1 1 100%; margin: 0; display: flex; overflow-x: auto; scrollbar-width: none; }
  .topbar .mode-seg::-webkit-scrollbar, .topbar .seg::-webkit-scrollbar { display: none; }
  .topbar .mode-seg button, .topbar .seg button { flex: 1 0 auto; min-height: 40px; font-size: .9rem; padding: 0 .8rem; white-space: nowrap; }
  #gear { top: 8px; right: 8px; width: 42px; height: 42px; }
  .judul-alat { top: 8px !important; right: calc(42px + 1rem) !important; gap: .35rem !important; }
  .judul-alat .iconbtn, .judul-alat a.iconbtn { width: 40px; height: 40px; }
  .judul-alat .btn-fs { display: none; }
  /* media Lab Maya: mode aktif sebagai blok biasa */
  .lab-main { flex: none; position: relative; }
  .mode { position: relative; inset: auto; padding: .8rem .75rem 1.6rem; }
  .mode:not(.on) { display: none !important; }
  /* layar pembuka */
  .intro { position: fixed; overflow-y: auto; place-items: start center; padding: 1rem .8rem; }
  .intro-kartu { grid-template-columns: 1fr; gap: 1rem; padding: 1.2rem 1.2rem 1.4rem; border-radius: 1.4rem; width: 100%; }
  .intro-kartu h1 { font-size: 2.3rem; }
  .intro-ilus { max-width: 13rem; margin: 0 auto; }
  .intro-catatan { font-size: .95rem; padding: .7rem .9rem; }
  /* tombol */
  .btn { min-height: 44px; font-size: .95rem; padding: .4rem 1rem; }
  .btn.besar { min-height: 50px; font-size: 1.05rem; padding: .5rem 1.2rem; }
  .btn.mega { font-size: 1.35rem; min-height: 58px; padding: .5rem 1.8rem; }
  .btn.kecil { min-height: 40px; font-size: .88rem; padding: .25rem .8rem; }
  .iconbtn { width: 44px; height: 44px; }
  .iconbtn.kecil { width: 40px; height: 40px; }
  .chip { min-height: 40px; font-size: .88rem; padding: .25rem .8rem; }
  .chip.besar { max-width: none; }
  .seg button { min-height: 40px; padding: 0 .8rem; font-size: .9rem; }
  .inp { font-size: 1rem; min-height: 44px; padding: .45rem .8rem; border-width: 2px; }
  /* modal, toast, Panel Guru */
  #modal { padding: .6rem; align-items: center; }
  .modal-box, .modal-box.lebar { width: 100%; max-height: 92vh; max-height: 92svh; border-radius: 1.2rem; }
  .modal-head { padding: .7rem 1rem; }
  .modal-head h2 { font-size: 1.15rem; }
  .modal-isi { padding: .9rem 1rem; }
  .modal-aksi { flex-wrap: wrap; gap: .5rem; padding: .7rem 1rem; }
  .modal-aksi .btn { flex: 1 1 auto; }
  #toast { font-size: .92rem; padding: .7rem 1rem; max-width: 94vw; bottom: 1rem; }
  .guru-box { width: 100vw; height: 100vh; height: 100svh; border-radius: 0; }
  .guru-head { padding: .6rem .8rem; padding-right: calc(42px + 1.4rem); gap: .5rem; flex-wrap: wrap; }
  .guru-head h2 { font-size: 1.05rem; }
  .guru-head .status { display: none; }
  .guru-tubuh { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .guru-nav { flex-direction: row; overflow-x: auto; padding: .5rem; gap: .3rem; }
  .guru-nav button { flex: none; min-height: 40px; padding: 0 .8rem; font-size: .88rem; }
  .guru-isi { padding: 1rem .9rem 2.5rem; }
  /* sampul permainan duel */
  .duel-sampul, .det-sampul, .ba-sampul { place-items: start center; padding: 4.2rem .6rem 1.2rem; overflow-y: auto; }
  .st-kartu { width: 100%; padding: 1.4rem 1rem 1rem; border-radius: 1.4rem; }
  .st-ikon { width: 4.6rem; height: 4.6rem; margin: -3.4rem auto .2rem; }
  .st-kartu h1 { font-size: 2.2rem; }
  .st-sub { font-size: .98rem; }
  .st-tim-baris { grid-template-columns: 1fr; gap: .5rem; }
  .st-vs { font-size: 1.6rem; }
  .st-opsi-baris { gap: .8rem; }
  .st-opsi .seg button { min-width: 4rem; font-size: .95rem; }
  .duel-main { grid-template-columns: 1fr; gap: .8rem; padding: .7rem; flex: none; }
  .timer-wadah { width: 6.5rem; height: 6.5rem; }
  .tc-angka { font-size: 2.3rem; }
  .tim-kepala { min-height: 3.2rem; padding: .35rem .5rem .35rem .9rem; gap: .6rem; }
  .tim-kepala .tk-nama { font-size: 1.15rem; }
  .tim-kepala .tk-skor { min-width: 3.6rem; height: 2.6rem; font-size: 1.6rem; }
  .pil-ronde { font-size: .9rem; padding: .2rem .7rem; order: 15; }
  .juara-kartu { width: 100%; padding: 1rem .9rem 1.2rem; }
  .juara-kartu h1 { font-size: 2.2rem; }
  /* tabel lebar dapat digeser */
  .tabel-wadah { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tabel { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; font-size: .85rem; }
  .tabel th, .tabel td { padding: .45rem .6rem; }
  .tabel td { white-space: normal; min-width: 4.5rem; }
  .kosong-besar { padding: 1.4rem 1rem; }
  .kosong-besar h3 { font-size: 1.15rem; }
}
/* HP mendatar: tetap dapat digulir, kartu pembuka dua kolom */
@media (max-height: 500px) and (min-width: 600px) and (max-width: 1100px) {
  .intro-kartu { grid-template-columns: .7fr 1.3fr; }
  .st-tim-baris { grid-template-columns: 1fr auto 1fr; }
}

/* =====================================================================
   G2 · BOCOR ATAU AMAN? — gaya khusus
   ===================================================================== */
/* sampul */
.ba-sampul { display: grid; place-items: center; overflow: hidden; background: linear-gradient(120deg, #FDEBE5 0%, #FFF8EE 45%, #E5F5F2 100%); }
.ba-latar { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.ba-latar i { position: absolute; top: -10%; width: 1.4rem; height: 1.9rem; background: rgba(231, 111, 81, .22); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; animation: tetesLatar 13s linear infinite; }
.ba-latar i:nth-child(even) { background: rgba(42, 157, 143, .2); border-radius: .4rem; width: 1.6rem; height: 1.3rem; }
@keyframes tetesLatar { to { transform: translateY(125vh) rotate(25deg); } }
.ba-sampul .judul-alat { right: calc(var(--sentuh) + 2.4rem); }
.ba-kartu-sampul { width: min(60rem, 92vw); }
.ba-ikon { color: var(--teal); }
.gembok { width: 100%; height: 100%; display: block; overflow: visible; }
.gembok .belenggu { transform-box: view-box; transform-origin: 44px 30px; transition: transform .45s cubic-bezier(.3, 1.5, .5, 1); }
.gembok.buka .belenggu { transform: translateY(-7px) rotate(28deg); }
.gembok.goyang { animation: goyangGembok 3s ease-in-out infinite; }
.gembok.goyang .belenggu { animation: bukaTutup 3s ease-in-out infinite; }
@keyframes goyangGembok { 0%, 100% { transform: rotate(0); } 45% { transform: rotate(-6deg); } 55% { transform: rotate(6deg); } }
@keyframes bukaTutup { 0%, 40%, 100% { transform: none; } 55%, 85% { transform: translateY(-7px) rotate(28deg); } }
.ba-mode button { display: inline-flex; align-items: center; gap: .4rem; font-size: 1.15rem; }
.ba-isi-papan { text-align: left; margin-bottom: .8rem; }
.det-nama { display: flex; flex-direction: column; gap: .35rem; }
.det-nama b { color: var(--teks2); font-weight: 800; }
.ba-info-kartu { display: flex; align-items: center; justify-content: center; gap: .5rem; color: var(--teks2); margin: .2rem 0 .8rem; }
.ba-info-kartu .ic { color: var(--teal); }
.ba-info-kartu b { color: var(--navy); }
[hidden] { display: none !important; }

/* tata permainan */
.ba-main { background: linear-gradient(180deg, #E3F3F6, var(--krem) 55%); }
.ba-tata { flex: 1; min-height: 0; display: grid; gap: 1.2rem; padding: 1rem 1.4rem 1.1rem; }
.ba-tata.mode-papan { grid-template-columns: 1fr 20rem; }
.ba-tata.mode-tim { grid-template-columns: 22rem 1fr 22rem; }
.ba-tengah { display: flex; flex-direction: column; align-items: center; gap: 1rem; min-height: 0; }
.mode-tim .ba-tengah .timer-wadah { width: 7.5rem; height: 7.5rem; flex: none; }
.mode-tim .tc-angka { font-size: 2.8rem; }

/* kartu 3D */
.kartu { position: relative; width: min(60rem, 100%); flex: 1; min-height: 0; max-height: 34rem; perspective: 1800px; }
.mode-tim .kartu { max-height: 40rem; }
.kartu.masuk { animation: kartuMasuk .6s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes kartuMasuk { from { transform: translateY(-40px) rotate(-4deg) scale(.85); opacity: 0; } }
.kartu-putar { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.4, .1, .2, 1.1); }
.kartu-putar.balik { transform: rotateY(180deg); }
.muka { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 2rem; background: #fff; box-shadow: var(--bayang-kuat); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1.6rem 2.6rem; gap: .6rem; overflow: hidden; }
.muka.depan { border: 6px solid var(--navy); background: radial-gradient(circle at 50% 0%, #EAF6F4, #fff 55%); }
.muka.belakang { transform: rotateY(180deg); border: 6px solid var(--garis); }
.kartu.bocor .muka.belakang { border-color: var(--koral); background: linear-gradient(180deg, #FFF1EE, #fff 45%); }
.kartu.aman .muka.belakang { border-color: var(--teal); background: linear-gradient(180deg, #E8F7F4, #fff 45%); }
.md-no { position: absolute; top: 1rem; left: 1.4rem; font-weight: 900; color: var(--teks2); letter-spacing: .06em; text-transform: uppercase; font-size: .9rem; }
.md-ikon { width: 9rem; height: 9rem; animation: lompat 2.4s ease-in-out infinite; }
.md-ikon svg { width: 100%; height: 100%; }
.md-teks { font-size: 2.1rem; font-weight: 900; line-height: 1.25; margin: 0; max-width: 46rem; }
.md-tanya { color: var(--oranye); font-weight: 900; font-size: 1.1rem; }
.muka.depan::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(29, 53, 87, .07) 1.5px, transparent 2px); background-size: 26px 26px; pointer-events: none; }
.muka.depan > * { position: relative; }
.muka.depan > .md-no { position: absolute; }
.md-jalur { width: min(26rem, 80%); margin-top: .4rem; }
.md-jalur svg { width: 100%; height: auto; display: block; overflow: visible; }
.jl-paket { animation: jlPaket 2.6s ease-in-out infinite; }
@keyframes jlPaket { 0% { transform: translateX(-150px); opacity: 0; } 12% { opacity: 1; } 50% { transform: translateX(0); } 88% { opacity: 1; } 100% { transform: translateX(150px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .jl-paket { animation: none; } }
.mb-vonis { display: flex; align-items: center; gap: 1rem; font-size: 4rem; font-weight: 900; letter-spacing: .06em; }
.mb-vonis.bocor { color: var(--koral); } .mb-vonis.aman { color: var(--teal); }
.mb-gembok { width: 5rem; height: 5rem; display: block; }
.kartu-putar.balik .mb-vonis.bocor .gembok .belenggu { animation: gembokBuka .6s .7s cubic-bezier(.3, 1.6, .5, 1) both; }
.kartu-putar.balik .mb-vonis.aman .gembok .belenggu { animation: gembokKunci .6s .7s cubic-bezier(.3, 1.6, .5, 1) both; }
.mb-vonis .gembok.buka .belenggu, .mb-vonis .gembok.kunci .belenggu { transition: none; }
@keyframes gembokBuka { from { transform: none; } to { transform: translateY(-7px) rotate(28deg); } }
@keyframes gembokKunci { from { transform: translateY(-7px) rotate(28deg); } to { transform: none; } }
.mb-teks { font-size: 1.15rem; color: var(--teks2); font-weight: 700; margin: 0; max-width: 44rem; }
.mb-jelas { font-size: 1.55rem; font-weight: 800; line-height: 1.3; margin: .2rem 0; max-width: 46rem; }
.mb-sumber { display: flex; align-items: center; gap: .5rem; background: var(--krem); border-radius: 999px; padding: .4rem 1.1rem; font-weight: 800; color: var(--teks2); font-size: .95rem; }
/* tetesan data bocor */
.tetes-wadah { position: absolute; left: 6%; right: 6%; bottom: 0; height: 0; pointer-events: none; z-index: 3; }
.tetes-wadah i { position: absolute; top: -6px; width: calc(1rem * var(--s)); height: calc(1.35rem * var(--s)); background: var(--koral); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform-origin: top center; animation: menetes 1.6s ease-in both; opacity: .9; }
.tetes-wadah i::before { content: ""; position: absolute; left: 50%; top: -.6rem; width: 35%; height: .9rem; margin-left: -17%; background: var(--koral); border-radius: 50% 50% 0 0; }
@keyframes menetes { 0% { transform: scaleY(.2); opacity: 0; } 25% { transform: scaleY(1.2); opacity: .95; } 100% { transform: translateY(18rem) scaleY(1); opacity: 0; } }

/* tombol jawab raksasa */
.ba-jawab { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; width: min(60rem, 100%); }
.btn-jawab { display: flex; align-items: center; justify-content: center; gap: 1rem; min-height: 8rem; border-radius: 1.8rem; color: #fff; font-size: 2.8rem; font-weight: 900; letter-spacing: .08em; box-shadow: 0 .6rem 0 rgba(0, 0, 0, .18), var(--bayang); transition: transform .12s, box-shadow .12s, opacity .2s, filter .2s; }
.btn-jawab.bocor { background: var(--koral); }
.btn-jawab.aman { background: var(--teal); }
.btn-jawab:active:not(:disabled) { transform: translateY(.4rem); box-shadow: 0 .2rem 0 rgba(0, 0, 0, .18); }
.btn-jawab:disabled { opacity: .45; cursor: default; }
.btn-jawab.dipilih { opacity: 1; outline: .4rem solid var(--navy); outline-offset: .3rem; }
.btn-jawab.benar { opacity: 1; filter: none; animation: pop .5s; box-shadow: 0 0 0 .5rem rgba(46, 204, 113, .55), var(--bayang); }
.btn-jawab.salah { opacity: 1; filter: grayscale(.6); animation: getar .4s; }
.bj-ikon { width: 3.4rem; height: 3.4rem; color: #fff; }
.btn-jawab:hover:not(:disabled) .gembok.kunci .belenggu, .btn-jawab:active:not(:disabled) .gembok.kunci .belenggu { transform: translateY(-4px); }
.ba-aksi { min-height: 4.5rem; display: flex; align-items: center; }
.btn-lanjut { animation: masukAtas .4s both, denyut 2.2s .4s ease-in-out infinite; }

/* samping (satu papan) */
.ba-samping { display: flex; flex-direction: column; gap: .9rem; }
.det-pemain { display: flex; align-items: center; gap: .5rem; background: var(--navy); color: #fff; border-radius: 1rem; padding: .55rem .9rem; font-size: 1.1rem; }
.det-pemain b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ba-samping .timer-wadah { width: 10rem; height: 10rem; }
.det-skor, .ba-benar { background: #fff; border-radius: 1.2rem; box-shadow: var(--bayang); display: flex; align-items: baseline; justify-content: space-between; padding: .5rem 1.1rem; }
.det-skor small, .ba-benar small { font-weight: 800; color: var(--teks2); }
.det-skor b { font-size: 2.6rem; font-weight: 900; color: var(--teal-d); font-variant-numeric: tabular-nums; }
.ba-benar b { font-size: 1.8rem; font-weight: 900; }
.ba-streak { display: flex; align-items: center; gap: .6rem; background: #fff; border-radius: 1.2rem; box-shadow: var(--bayang); padding: .5rem 1.1rem; }
.ba-streak .api { width: 2.6rem; height: 2.6rem; filter: grayscale(1); opacity: .5; transition: all .3s; }
.ba-streak .api svg { width: 100%; height: 100%; }
.ba-streak b { font-size: 2rem; font-weight: 900; }
.ba-streak small { font-weight: 800; color: var(--teks2); }
.ba-streak.panas { background: #FFF1E3; }
.ba-streak.panas .api { filter: none; opacity: 1; animation: lompat .6s ease-in-out infinite; }
.ba-streak.pop { animation: pop .45s; }

/* dua tim */
.ba-tim { gap: 1rem; }
.ba-tim .tim-kepala .tk-nama { font-size: 1.4rem; }
.ba-status { text-align: center; font-weight: 900; font-size: 1.15rem; color: var(--c); background: var(--cm); border-radius: 1rem; padding: .5rem; }
.ba-jawab-tim { flex: 1; display: flex; flex-direction: column; gap: 1rem; }
.ba-jawab-tim .btn-jawab { flex: 1; flex-direction: column; font-size: 2.4rem; gap: .4rem; }
.ba-jawab-tim .bj-ikon { width: 4.4rem; height: 4.4rem; }
.ba-tim.kunci .ba-jawab-tim .btn-jawab:not(.dipilih) { opacity: .25; }
.ba-hasil-tim { min-height: 3.4rem; }
.ba-hasil-tim > div { display: flex; justify-content: space-between; align-items: center; border-radius: 1rem; padding: .6rem 1rem; font-weight: 900; font-size: 1.1rem; animation: bintang .45s cubic-bezier(.2, .9, .3, 1.4) both; }
.ba-hasil-tim b { font-size: 1.6rem; }
.bh-benar { background: #DDF6E8; color: #1E8E4E; }
.bh-salah { background: #FDECEA; color: #C0392B; }
.bh-kosong { background: var(--krem2); color: var(--teks2); }

/* hasil */
.hasil-kartu h1 { color: var(--navy); }

/* Pembuat elemen ringkas: h('div.kelas#id', {atribut, on:{klik}}, anak...) */
function h(tag, attrs, ...kids) {
  const m = tag.match(/^([a-z0-9]+)?((?:[.#][\w-]+)*)$/i);
  const el = document.createElement(m[1] || 'div');
  (m[2].match(/[.#][\w-]+/g) || []).forEach(t => {
    if (t[0] === '.') el.classList.add(t.slice(1)); else el.id = t.slice(1);
  });
  if (attrs !== undefined && (attrs === null || typeof attrs !== 'object' || attrs instanceof Node || Array.isArray(attrs))) { kids.unshift(attrs); attrs = null; }
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'on') for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'style' && typeof v === 'object') { for (const [sk, sv2] of Object.entries(v)) sk.startsWith('--') ? el.style.setProperty(sk, sv2) : (el.style[sk] = sv2); }
      else if (k in el && k !== 'list' && typeof v !== 'string') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  kids.flat(Infinity).forEach(k => {
    if (k == null || k === false) return;
    el.appendChild(k instanceof Node ? k : document.createTextNode(String(k)));
  });

/* ---------- Kecilkan gambar unggahan agar muat di localStorage ---------- */
function kecilkanGambar(file, maks = 1100, mutu = .78) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, maks / Math.max(img.width, img.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', mutu));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
