/* ---------- Timer cincin ---------- */
function buatTimer(el) {
  const R = 44, K = 2 * Math.PI * R;
  const lingkar = sv('circle', { cx: 50, cy: 50, r: R, class: 'tc-isi', 'stroke-dasharray': K, 'stroke-dashoffset': 0 });
  const angka = h('b.tc-angka', '–');
  el.innerHTML = '';
  el.append(h('div.timer-cincin', sv('svg', { viewBox: '0 0 100 100' }, sv('circle', { cx: 50, cy: 50, r: R, class: 'tc-latar' }), lingkar), angka));
  let raf = 0, akhir = 0, total = 1, cb = {}, sisaLama = -1;
  const T = {
    jalan: false,
    mulai(detik, c = {}) {
      cancelAnimationFrame(raf); total = detik * 1000; akhir = performance.now() + total; cb = c; sisaLama = -1; T.jalan = true; el.classList.remove('kritis', 'habis');
      const langkah = now => {
        const sisa = Math.max(0, akhir - now), s = Math.ceil(sisa / 1000);
        lingkar.setAttribute('stroke-dashoffset', K * (1 - sisa / total));
        if (s !== sisaLama) { sisaLama = s; angka.textContent = s; if (s <= (cb.kritis || 5) && s > 0) { el.classList.add('kritis'); if (cb.suara) cb.suara(s); else Suara.tik(); cb.tik && cb.tik(s); } else el.classList.remove('kritis'); }
        if (sisa <= 0) { T.jalan = false; el.classList.add('habis'); el.classList.remove('kritis'); cb.habis && cb.habis(); return; }
        raf = requestAnimationFrame(langkah);
      };
      raf = requestAnimationFrame(langkah);
    },
    henti() { cancelAnimationFrame(raf); T.jalan = false; el.classList.remove('kritis'); },
    kurangi(detik) { if (T.jalan) akhir -= detik * 1000; },
    sisa() { return T.jalan ? Math.max(0, (akhir - performance.now()) / 1000) : 0; },
    set(teks) { angka.textContent = teks; lingkar.setAttribute('stroke-dashoffset', 0); el.classList.remove('kritis', 'habis'); }
  };
  return T;
}

          h('button.btn.ghost', { on: { click: async () => { const f = await pilihBerkas('application/json,.json'); if (!f) return; try { const d = JSON.parse(await f.text()), arr = Array.isArray(d) ? d : d.skenario; if (!Array.isArray(arr)) throw new Error('daftar skenario tidak ditemukan'); S.skenario = arr.map(s => ({ id: s.id || 's' + uid(), aktif: s.aktif !== false, teks: String(s.teks || ''), ikon: IKON_SK[s.ikon] ? s.ikon : 'tanya', jawaban: s.jawaban === 'bocor' || s.jawaban === 'aman' ? s.jawaban : null, penjelasan: String(s.penjelasan || ''), sumber: String(s.sumber || '') })); simpan(); toast(`${S.skenario.length} skenario diimpor.`, 'ok'); ulang(); } catch (e) { toast('Impor gagal: ' + e.message, 'warn'); } } } }, ik('upload'), 'Impor JSON'),
          h('button.btn.ghost', { on: { click: async () => { if (await konfirmasi('Pulihkan skenario bawaan?', '6 skenario umum + 4 baris jalur berbagi kosong.', 'Pulihkan')) { S.skenario = dataBawaan().skenario; simpan(); ulang(); } } } }, ik('refresh'), 'Bawaan')),
        h('div.sk-daftar', S.skenario.map((s, k) => h('div.sk-item' + (s.jawaban ? '' : '.tunggu') + (s.aktif ? '' : '.mati'),
          h('div.sk-kiri', h('span.sk-ikon', { html: svIkon(s.ikon) }),
            h('select.inp.sk-pilih-ikon', { on: { change: e => { s.ikon = e.target.value; simpan(); ulang(); } } }, Object.keys(IKON_SK).map(k2 => h('option', { value: k2, selected: s.ikon === k2 }, k2)))),
          h('div.sk-tengah',
            h('textarea.inp', { rows: 2, maxlength: 200, placeholder: 'Teks skenario', on: { change: e => { s.teks = e.target.value.trim(); simpan(); } } }, s.teks),
            h('div.sk-baris', h('div.seg.kecil', [['bocor', 'BOCOR'], ['aman', 'AMAN'], [null, 'Belum diisi']].map(([v, t]) => h('button' + (s.jawaban === v ? '.on' : ''), { on: { click: () => { s.jawaban = v; simpan(); ulang(); } } }, t))),
              h('label.cek', h('input', { type: 'checkbox', checked: s.aktif, on: { change: e => { s.aktif = e.target.checked; simpan(); ulang(); } } }), 'Aktif')),
            h('textarea.inp', { rows: 2, maxlength: 300, placeholder: 'Penjelasan (tampil saat kartu berbalik)', on: { change: e => { s.penjelasan = e.target.value.trim(); simpan(); } } }, s.penjelasan),
            h('input.inp', { value: s.sumber, maxlength: 120, placeholder: 'Sumber, mis. Hasil uji kelas X-1, 14 Oktober 2026', on: { change: e => { s.sumber = e.target.value.trim(); simpan(); } } })),
          h('button.iconbtn.kecil', { 'aria-label': 'Hapus skenario', html: ikon('trash'), on: { click: async () => { if (await konfirmasi('Hapus skenario?', esc(s.teks || '(kosong)'), 'Hapus')) { S.skenario.splice(k, 1); simpan(); ulang(); } } } })))));
    }],
    ['main', 'Permainan', 'game', el => {
      el.append(h('label.cek', h('input', { type: 'checkbox', checked: S.cfg.acak, on: { change: e => { S.cfg.acak = e.target.checked; simpan(); } } }), h('span', h('b', 'Acak urutan kartu'), h('br'), h('small.catatan', 'Bila mati, kartu mengikuti urutan daftar skenario.'))));
    }],
    ['data', 'Data', 'download', (el, ulang) => tabDataLab(el, ulang, 'bocor-aman-data',
      h('div', h('h3', 'Papan peringkat'), h('p.catatan', `${S.peringkat.length} skor tersimpan.`),
        h('div.aksi', h('button.btn.ghost', { disabled: !S.peringkat.length, on: { click: () => unduhCSV([['Peringkat', 'Nama', 'Skor', 'Benar', 'Total', 'Beruntun', 'Waktu'], ...S.peringkat.map((p, i) => [i + 1, p.nama, p.skor, p.benar, p.total, p.streak, p.waktu])], `peringkat-bocor-aman-${tglFile()}.csv`) } }, ik('download'), 'Unduh Peringkat CSV'),
          h('button.btn.danger.kecil', { disabled: !S.peringkat.length, on: { click: async () => { if (await konfirmasi('Hapus papan peringkat?', 'Semua skor dihapus.', 'Hapus')) { S.peringkat = []; simpan(); ulang(); } } } }, ik('trash'), 'Hapus Peringkat'))))]
  ], () => { if (B.fase === 'sampul') tampilSampul(); });
}

/* ---------- Mulai ---------- */
function mulaiG2() {
  muat();
  /* pembaruan: skenario jalur berbagi bawaan yang masih kosong diisi otomatis */
  const baku = dataBawaan().skenario;
  S.skenario.forEach(s => { if (!s.jawaban) { const b = baku.find(x => x.id === s.id && x.ikon === s.ikon); if (b && b.jawaban) Object.assign(s, { teks: b.teks, jawaban: b.jawaban, penjelasan: b.penjelasan, sumber: b.sumber }); } });
  simpan();
  Suara.on = S.cfg.suara !== false;
  siapkanBilahLab();
  $('#btn-simpan').append(ik('download'), 'Simpan Hasil');
  $('#btn-simpan').addEventListener('click', simpanHasil);
  $('#btn-info').addEventListener('click', () => { Suara.klik(); petunjuk(); });
  siapkanGearLab(bukaGuru);
  tampilSampul();
  if (!simpanOK) setTimeout(() => toast('Penyimpanan peramban tidak tersedia. Skenario hanya bertahan selama halaman terbuka.', 'warn', 5000), 1200);
}
document.addEventListener('DOMContentLoaded', mulaiG2);

</script>
<script>document.addEventListener('click',e=>{document.querySelectorAll('details.menu-proyek[open]').forEach(d=>{if(!d.contains(e.target))d.open=false})});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('details.menu-proyek[open]').forEach(d=>d.open=false)});</script>
