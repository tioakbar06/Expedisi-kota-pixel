#modal.on .modal-box { transform: none; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.2rem 1rem 1.8rem; background: #fff; }
.modal-head h2 { margin: 0; font-size: 1.6rem; }
.modal-isi { padding: 1.4rem 1.8rem; overflow: auto; font-size: 1.1rem; }
.modal-aksi { display: flex; justify-content: flex-end; gap: .8rem; padding: 0 1.8rem 1.4rem; }
.grid-info { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
.tile { position: relative; overflow: hidden; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 1rem; align-items: center; text-align: left; background: #fff; border-radius: 1.2rem; padding: 1.1rem 1.3rem; box-shadow: var(--bayang); min-height: 6rem; }
.tile-ikon { grid-row: span 2; width: 3.6rem; height: 3.6rem; border-radius: 1rem; background: var(--teal); color: #fff; display: grid; place-items: center; }
.tile-ikon.kecil { width: 2.8rem; height: 2.8rem; }
.tile-ikon .ic { width: 55%; height: 55%; }
.tile b { font-size: 1.25rem; } .tile small { color: var(--teks2); }
.info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; margin-bottom: 1.2rem; }
.info-sel { background: #fff; padding: .7rem 1rem; border-radius: 1rem; } .info-sel small { display: block; color: var(--teks2); font-weight: 700; } .info-sel b { font-size: 1.15rem; }
.tp-list { display: grid; gap: .7rem; }
.tp { background: #fff; border-left: .5rem solid var(--c); padding: .8rem 1.1rem; border-radius: .9rem; } .tp p { margin: .2rem 0 0; }
.profil { display: grid; grid-template-columns: 9rem 1fr; gap: 1.6rem; align-items: center; }
.profil-foto svg { width: 100%; }
ol.pustaka { padding-left: 1.4rem; display: grid; gap: .6rem; user-select: text; }
.lkpd-list { display: grid; gap: .7rem; }
.lkpd { display: flex; align-items: center; gap: 1rem; background: #fff; padding: .7rem 1rem; border-radius: 1rem; }
.lkpd > div { flex: 1; } .lkpd small { display: block; color: var(--teks2); }
#toast { position: fixed; left: 50%; bottom: 3vh; opacity: 0; transform: translate(-50%, calc(100% + 4vh)); z-index: 90; background: var(--navy); color: #fff; padding: .9rem 1.6rem; border-radius: 1rem; font-weight: 700; font-size: 1.1rem; max-width: 80vw; box-shadow: var(--bayang-kuat); transition: transform .35s cubic-bezier(.3, 1.4, .5, 1), opacity .3s; pointer-events: none; }
#toast.on { transform: translate(-50%, 0); opacity: 1; }
#toast.warn { background: var(--koral); } #toast.ok { background: var(--teal); }
#confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 95; display: none; }
#confetti.on { display: block; }

/* ---------- Roda gigi & Panel Guru ---------- */
#gear { position: fixed; top: calc((var(--bar) - var(--sentuh)) / 2); right: 1.2rem; z-index: 58; width: var(--sentuh); height: var(--sentuh); border-radius: 50%; background: #fff; color: var(--teks2); display: grid; place-items: center; box-shadow: var(--bayang); touch-action: none; }
#gear > .ic { width: 50%; height: 50%; transition: transform 2s linear; }
.gear-cincin { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.gear-cincin circle { stroke-dasharray: 183; stroke-dashoffset: 183; transition: stroke-dashoffset .2s; }
#gear.tahan .gear-cincin circle { stroke-dashoffset: 0; transition: stroke-dashoffset 2s linear; }
#gear.tahan > .ic { transform: rotate(180deg); color: var(--oranye); }
#guru { position: fixed; inset: 0; z-index: 57; background: rgba(15, 25, 45, .5); display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .3s; }
#guru.on { opacity: 1; pointer-events: auto; }
.guru-box { width: 94vw; height: 90vh; background: var(--krem); border-radius: 1.6rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--bayang-kuat); }
.guru-head { display: flex; align-items: center; gap: 1rem; padding: .8rem 1.4rem; background: var(--navy); color: #fff; padding-right: calc(var(--sentuh) + 2.6rem); }
.guru-head h2 { margin: 0; flex: 1; }
.guru-head > .ikw .ic { width: 2rem; height: 2rem; color: var(--oranye); }
.guru-tubuh { flex: 1; display: grid; grid-template-columns: 17rem 1fr; min-height: 0; }
.guru-nav { background: #fff; padding: 1rem; display: flex; flex-direction: column; gap: .4rem; overflow: auto; }
.guru-nav button { display: flex; align-items: center; gap: .7rem; min-height: var(--sentuh); padding: 0 1rem; border-radius: .9rem; font-weight: 800; text-align: left; }
.guru-nav button.on { background: var(--teal); color: #fff; }
.guru-isi { overflow: auto; padding: 1.4rem 2rem 3rem; }
.guru-isi h3 { margin-top: 1.4rem; }
.pert-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: .7rem; }
.pert-btn { display: flex; flex-direction: column; align-items: flex-start; gap: .1rem; text-align: left; background: #fff; border: 3px solid var(--garis); border-radius: 1rem; padding: .7rem .8rem; min-height: 7rem; }
.pert-btn b { font-size: 1.3rem; } .pert-btn small { font-weight: 800; color: var(--teal); } .pert-btn span { font-size: .8rem; color: var(--teks2); line-height: 1.25; }
.pert-btn.on { border-color: var(--oranye); background: #FFF1E3; box-shadow: 0 0 0 .3rem rgba(244, 162, 97, .3); }
details.soal-ed { margin-bottom: .7rem; }
details.soal-ed summary { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: block; line-height: var(--sentuh); }
details.soal-ed[open] summary { white-space: normal; line-height: 1.3; padding: .9rem 1rem; }
details.soal-ed .form { background: #fff; padding: 1rem 1.2rem; border-radius: 0 0 1rem 1rem; margin-top: -.6rem; padding-top: 1.4rem; }
.opsi-ed { display: grid; gap: .5rem; }
label.opsi-baris { display: flex !important; align-items: center; gap: .7rem; }
.ed-blok { background: #fff; padding: 1.2rem 1.4rem; border-radius: 1.2rem; box-shadow: var(--bayang); margin-bottom: 1.2rem; }
textarea.kode-ed { font-family: Consolas, "Courier New", monospace; font-size: .95rem; }
.ed-pesan { font-weight: 800; margin-top: .4rem; } .ed-pesan.ok { color: #1E8E4E; } .ed-pesan.no { color: var(--salah); }
.tabel-ed { display: grid; gap: .6rem; }
.lab-ed { display: grid; grid-template-columns: auto 1fr 1.2fr auto; gap: 1rem; align-items: center; background: #fff; padding: .5rem 1rem; border-radius: 1rem; }
.lab-ed small { color: var(--teks2); }
.saklar { display: flex; align-items: center; gap: .5rem; font-weight: 800; min-height: var(--sentuh); }
.pratinjau { width: 14rem; aspect-ratio: 4 / 3; background: var(--krem2); border-radius: 1rem; overflow: hidden; display: grid; place-items: center; color: var(--teks2); flex: none; }
.pratinjau img { width: 100%; height: 100%; object-fit: cover; }
.form-gambar { display: flex; gap: 1.2rem; align-items: center; }
.form-gambar > div { display: flex; flex-wrap: wrap; gap: .6rem; }

/* ---------- Animasi ---------- */
@keyframes denyut { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@keyframes riak { to { transform: scale(2.4); opacity: 0; } }
@keyframes muncul { from { opacity: 0; transform: translateY(24px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes masukGeser { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
@keyframes masukAtas { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
@keyframes getar { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
@keyframes sinar { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
@keyframes lompat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes putar { to { transform: rotate(360deg); } }
@keyframes kedip { 50% { opacity: .25; } }
@keyframes kibar { from { transform: skewY(-8deg); } to { transform: skewY(8deg) scaleX(.85); } }
@keyframes gelombang { 0% { opacity: .9; transform: scale(.4); } 100% { opacity: 0; transform: scale(5); } }
@keyframes awan { from { translate: -40px 0; } to { translate: 60px 0; } }
@keyframes alir { to { stroke-dashoffset: -40; } }
@keyframes terbang { to { transform: translateY(-80px); opacity: 0; } }
@keyframes meledak { to { transform: var(--t, none) scale(1.6); opacity: 0; } }
@keyframes ledak { to { width: 220px; height: 220px; margin: -110px; opacity: 0; } }
@keyframes bintang { from { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.2); } to { transform: none; } }

/* ---------- Penyesuaian layar ---------- */
.isi-nama-baris { display: flex; gap: .8rem; width: min(36rem, 100%); margin: .6rem auto 1rem; }
.isi-nama-baris .inp { flex: 1; min-width: 0; }
@media (max-aspect-ratio: 4/3) {
  .judul-kartu { width: min(44rem, 88vw); margin: auto; }
  #scr-judul svg.city { left: 0; width: 100%; opacity: .45; }
  .identitas-wrap { grid-template-columns: 1fr; } .identitas-ilus { display: none; }
  .slide { grid-template-columns: 1fr; grid-template-rows: auto 1fr; padding: 1.4rem; }
  .urut-wrap, .jodoh-wrap, .sert-wrap, .voting-setup, .lb-isi { grid-template-columns: 1fr; }
  .rb-tahap { display: none; }
  .pert-grid { grid-template-columns: repeat(3, 1fr); }
  .guru-tubuh { grid-template-columns: 1fr; } .guru-nav { flex-direction: row; overflow-x: auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* =====================================================================
   Gaya bersama media Lab Maya (A1–A7, G1–G4)
   ===================================================================== */
.lab-app { background: linear-gradient(180deg, #E3F3F6 0%, var(--krem) 45%); }
.mode-seg { margin-left: 1rem; }
.mode-seg button { font-size: 1.05rem; display: inline-flex; align-items: center; gap: .4rem; }
.jml:not(:empty) { background: var(--koral); color: #fff; border-radius: 999px; padding: 0 .55rem; font-size: .8rem; line-height: 1.6; }
a.iconbtn { text-decoration: none; }
.lab-main { flex: 1; min-height: 0; position: relative; }
.mode { position: absolute; inset: 1.1rem 1.4rem 1.2rem; display: none; flex-direction: column; min-height: 0; }
.mode.on { display: flex; animation: masukAtas .4s both; }
.intro { position: fixed; inset: 0; z-index: 70; background: radial-gradient(circle at 30% 30%, #E5F5F2, #FFF8EE 60%); display: none; place-items: center; padding: 2vh 2vw; }
.intro.on { display: grid; }
.intro-kartu { display: grid; grid-template-columns: .8fr 1.2fr; gap: 2.4rem; align-items: center; width: min(92vw, 84rem); background: #fff; border-radius: 2rem; padding: 2.4rem 2.8rem; box-shadow: var(--bayang-kuat); animation: muncul .6s both; }
.intro-kartu h1 { font-size: 4.2rem; font-weight: 900; margin: .5rem 0 .3rem; }
.intro-ilus svg { width: 100%; }
.intro-catatan { display: flex; gap: 1rem; align-items: center; background: #EAF6F4; border-left: .6rem solid var(--teal); padding: 1rem 1.2rem; border-radius: 1rem; font-size: 1.1rem; margin: 1rem 0; }
.intro-catatan .ic { width: 2.2rem; height: 2.2rem; color: var(--teal); }
.pojok-catatan { position: absolute; z-index: 4; background: rgba(255, 255, 255, .9); color: var(--navy); font-weight: 800; font-size: .85rem; padding: .3rem .8rem; border-radius: 999px; box-shadow: var(--bayang); pointer-events: none; }
.slider-baris { display: flex; align-items: center; gap: 1rem; }
input[type=range].geser { -webkit-appearance: none; appearance: none; flex: 1; height: 14px; border-radius: 999px; background: linear-gradient(90deg, var(--koral) var(--isi, 0%), var(--garis) var(--isi, 0%)); outline: none; }
input[type=range].geser::-webkit-slider-thumb { -webkit-appearance: none; width: 48px; height: 48px; border-radius: 50%; background: #fff; border: 6px solid var(--koral); box-shadow: var(--bayang); cursor: grab; }
input[type=range].geser::-moz-range-thumb { width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 6px solid var(--koral); cursor: grab; }
@media (max-aspect-ratio: 4/3) { .intro-kartu { grid-template-columns: 1fr; } .mode { overflow: auto; } }

/* =====================================================================
   Gaya bersama permainan Duel 2 Tim (G1–G4)
   ===================================================================== */
:root { --merah: #E63946; --biru: #2F6FDB; --merah-muda: #FDE4E6; --biru-muda: #E1EBFC; }

/* ---------- Sampul ---------- */
.duel-sampul { overflow: hidden; display: grid; place-items: center; }
.st-latar { position: absolute; inset: 0; overflow: hidden; }
.st-belah { position: absolute; top: -10%; bottom: -10%; width: 60%; }
.st-belah.kiri { left: -10%; background: linear-gradient(135deg, #F7A1A8, var(--merah)); transform: skewX(-8deg); animation: masukKiri .9s cubic-bezier(.2, .9, .3, 1.1) both; }
.st-belah.kanan { right: -10%; background: linear-gradient(225deg, #9CBCF3, var(--biru)); transform: skewX(-8deg); animation: masukKanan .9s cubic-bezier(.2, .9, .3, 1.1) both; }
.st-kilat { position: absolute; left: 50%; top: -10%; bottom: -10%; width: 1.2rem; background: #FFF8EE; transform: translateX(-50%) skewX(-8deg); box-shadow: 0 0 2rem #fff; animation: sinar 2.4s ease-in-out infinite; }
@keyframes masukKiri { from { transform: translateX(-60%) skewX(-8deg); } }
@keyframes masukKanan { from { transform: translateX(60%) skewX(-8deg); } }
.duel-sampul .judul-alat { right: calc(var(--sentuh) + 2.4rem); }
.st-kartu { position: relative; z-index: 2; width: min(58rem, 90vw); background: rgba(255, 255, 255, .95); border-radius: 2.2rem; padding: 2rem 2.6rem 1.4rem; box-shadow: var(--bayang-kuat); text-align: center; animation: muncul .8s .2s cubic-bezier(.2, .9, .3, 1.2) both; }
.st-ikon { width: 7rem; height: 7rem; margin: -5.5rem auto .3rem; background: #fff; border-radius: 50%; box-shadow: var(--bayang); display: grid; place-items: center; }
.st-ikon svg { width: 82%; height: 82%; }
.st-tag { display: inline-block; font-weight: 900; color: #fff; background: var(--navy); padding: .25rem 1rem; border-radius: 999px; font-size: .95rem; letter-spacing: .06em; text-transform: uppercase; }
.st-kartu h1 { font-size: 4.4rem; font-weight: 900; margin: .3rem 0 .1rem; letter-spacing: -.01em; }
.st-sub { font-size: 1.2rem; color: var(--teks2); margin: 0 auto 1rem; max-width: 46rem; }
.st-tim-baris { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: center; margin-bottom: 1rem; }
.st-tim { display: flex; flex-direction: column; gap: .3rem; background: color-mix(in srgb, var(--c) 10%, #fff); border: 4px solid var(--c); border-radius: 1.2rem; padding: .6rem .9rem; text-align: left; }
.st-warna { font-weight: 900; color: var(--c); font-size: .9rem; text-transform: uppercase; letter-spacing: .05em; }
.st-tim .inp { font-weight: 900; font-size: 1.35rem; border-color: transparent; background: rgba(255, 255, 255, .8); }
.st-vs { font-size: 2.4rem; font-weight: 900; color: var(--oranye); text-shadow: 0 .2rem 0 var(--navy); animation: lompat 1.6s ease-in-out infinite; }
.st-opsi-baris { display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
.st-opsi { display: flex; flex-direction: column; align-items: center; gap: .4rem; }
.st-opsi b { color: var(--teks2); }
.st-opsi .seg button { min-width: 5.2rem; font-size: 1.15rem; }
.st-mulai { margin: .2rem auto .8rem; }
.st-kaki { font-size: .85rem; color: var(--teks2); margin: 0; }

/* ---------- Arena ---------- */
.duel-arena { background: linear-gradient(90deg, #FFF0F1 0%, var(--krem) 30%, var(--krem) 70%, #EEF3FD 100%); }
.pil-ronde { display: flex; align-items: center; gap: .6rem; font-weight: 900; font-size: 1.15rem; background: var(--krem); border-radius: 999px; padding: .3rem 1.1rem; }
.titik-ronde { display: flex; gap: .3rem; }
.titik-ronde i { width: .75rem; height: .75rem; border-radius: 50%; background: var(--garis); display: block; transition: background .3s, transform .3s; }
.titik-ronde i.m { background: var(--merah); } .titik-ronde i.b { background: var(--biru); } .titik-ronde i.s { background: var(--teal); }
.titik-ronde i.kini { transform: scale(1.45); background: var(--oranye); }
.duel-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 21rem 1fr; gap: 1.1rem; padding: 1rem 1.3rem 1.1rem; }
.tim-panel { position: relative; display: flex; flex-direction: column; gap: .8rem; min-height: 0; --c: var(--merah); --cm: var(--merah-muda); }
.tim-panel.biru { --c: var(--biru); --cm: var(--biru-muda); }
.tim-kepala { display: flex; align-items: center; gap: 1rem; background: var(--c); color: #fff; border-radius: 1.3rem; padding: .5rem .6rem .5rem 1.2rem; box-shadow: var(--bayang); min-height: 4.4rem; }
.tim-kepala .tk-nama { font-size: 1.6rem; font-weight: 900; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tim-kepala .tk-status { font-weight: 800; font-size: .95rem; background: rgba(255, 255, 255, .22); padding: .25rem .8rem; border-radius: 999px; white-space: nowrap; }
.tim-kepala .tk-skor { min-width: 5.4rem; height: 3.4rem; border-radius: 1rem; background: #fff; color: var(--c); font-size: 2.3rem; font-weight: 900; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.tim-kepala .tk-skor.pop { animation: pop .5s; }
.tim-panel.kunci .tim-kepala .tk-status { background: #fff; color: var(--c); }

/* timer */
.timer-wadah { width: 9.5rem; height: 9.5rem; margin: 0 auto; }
.timer-cincin { position: relative; width: 100%; height: 100%; }
.timer-cincin svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.tc-latar { fill: #fff; stroke: var(--garis); stroke-width: 9; }
.tc-isi { fill: none; stroke: var(--teal); stroke-width: 9; stroke-linecap: round; transition: stroke .3s; }
.tc-angka { position: absolute; inset: 0; display: grid; place-items: center; font-size: 3.4rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.timer-wadah.kritis .tc-isi { stroke: var(--koral); }
.timer-wadah.kritis .tc-angka { color: var(--koral); animation: pop .5s; }
.timer-wadah.habis .tc-angka { color: var(--teks2); }

/* panji */
.panji { position: absolute; z-index: 6; top: 5.2rem; left: 50%; transform: translateX(-50%); display: flex; align-items: flex-start; pointer-events: none; animation: panjiNaik .6s cubic-bezier(.2, .9, .3, 1.3) both; }
.panji-tiang { width: .7rem; height: 9rem; border-radius: .4rem; background: linear-gradient(90deg, #8D6E4A, #6B4F33); box-shadow: var(--bayang); }
.panji-kain { margin-top: .4rem; background: var(--c); color: #fff; padding: .7rem 2.2rem .7rem 1.2rem; clip-path: polygon(0 0, 100% 0, 88% 50%, 100% 100%, 0 100%); transform-origin: left center; animation: kibar .5s ease-in-out infinite alternate; box-shadow: var(--bayang); display: flex; flex-direction: column; }
.panji-kain b { font-size: 1.6rem; font-weight: 900; white-space: nowrap; }
.panji-kain small { font-weight: 800; font-size: 1rem; opacity: .95; white-space: nowrap; }
@keyframes panjiNaik { from { transform: translate(-50%, 3rem) scale(.6); opacity: 0; } }

.pop-skor { position: fixed; z-index: 80; transform: translate(-50%, 0); font-size: 3rem; font-weight: 900; pointer-events: none; text-shadow: 0 .2rem 0 #fff, 0 0 1rem #fff; animation: skorTerbang 1.4s ease-out both; }
@keyframes skorTerbang { 0% { transform: translate(-50%, 1rem) scale(.4); opacity: 0; } 20% { transform: translate(-50%, 0) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -4rem) scale(1); opacity: 0; } }

.splash { position: fixed; inset: 0; z-index: 75; display: grid; place-items: center; pointer-events: none; background: rgba(29, 53, 87, .25); animation: muncul .3s both; }
.splash > div { background: var(--navy); color: #fff; border-radius: 2rem; padding: 1.4rem 3.4rem; text-align: center; box-shadow: var(--bayang-kuat); animation: bintang .5s cubic-bezier(.2, .9, .3, 1.3) both; }
.splash b { display: block; font-size: 4.4rem; font-weight: 900; line-height: 1.1; }
.splash small { font-size: 1.3rem; font-weight: 800; color: var(--oranye); }
.splash.pergi { opacity: 0; transition: opacity .3s; }

/* ---------- Juara ---------- */
.duel-juara { display: grid; place-items: center; overflow: auto; }
.juara-latar { position: absolute; inset: 0; background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--c) 25%, #fff), var(--krem) 70%); }
.juara-latar::before { content: ""; position: absolute; left: 50%; top: 30%; width: 160vmax; height: 160vmax; margin: -80vmax; background: repeating-conic-gradient(color-mix(in srgb, var(--c) 12%, transparent) 0 10deg, transparent 10deg 20deg); animation: putar 40s linear infinite; }
.juara-kartu { position: relative; z-index: 2; width: min(70rem, 92vw); max-height: 94vh; overflow: auto; background: #fff; border-radius: 2.2rem; padding: 1.4rem 2.4rem 1.6rem; box-shadow: var(--bayang-kuat); text-align: center; animation: muncul .7s cubic-bezier(.2, .9, .3, 1.2) both; }
.juara-piala { width: 7rem; margin: 0 auto; animation: lompat 1.8s ease-in-out infinite; }
.juara-label { font-weight: 900; text-transform: uppercase; letter-spacing: .12em; color: var(--oranye); font-size: 1.3rem; }
.juara-kartu h1 { font-size: 3.6rem; font-weight: 900; margin: .1rem 0 .5rem; }
.juara-skor { display: flex; justify-content: center; align-items: center; gap: 1.4rem; margin-bottom: 1rem; }
.juara-skor > div { min-width: 12rem; border-radius: 1.3rem; background: var(--c); color: #fff; padding: .4rem 1rem; }
.juara-skor small { display: block; font-weight: 800; font-size: 1rem; }
.juara-skor b { font-size: 3.4rem; font-weight: 900; line-height: 1.1; }
.juara-skor > span { font-size: 3rem; font-weight: 900; color: var(--teks2); }
.juara-aksi { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }

/* layar rendah (mis. 1366 × 768): sampul dipadatkan agar muat */
.duel-sampul, .det-sampul, .ba-sampul { overflow-y: auto; }
@media (max-height: 860px) {
  .st-kartu { padding: 1.1rem 2rem .9rem; }
  .st-kartu h1 { font-size: 3rem; }
  .st-ikon { width: 5rem; height: 5rem; margin: -3.6rem auto .2rem; }
  .st-sub { font-size: 1.05rem; margin-bottom: .6rem; }
  .st-tim-baris, .st-opsi-baris { margin-bottom: .6rem; }
  .st-mulai { margin: 0 auto .4rem; }
  .btn.mega.st-mulai { min-height: calc(var(--sentuh) * 1.15); font-size: 1.6rem; }
  .dc-gambar { aspect-ratio: 16 / 7; }
  .juara-kartu { padding: 1rem 2rem 1.2rem; }
  .juara-piala { width: 5rem; }
  .juara-kartu h1 { font-size: 2.8rem; }
}

/* ================= HP (bersama G1–G4) ================= */
@media (max-width: 760px), (max-height: 500px) and (max-width: 1100px) {
  .screen.on:has(.juara-kartu) { display: grid; place-items: start center; padding: 1rem .6rem; }
  .juara-kartu { width: 100%; max-height: none; border-radius: 1.4rem; }
  .juara-piala { width: 4.4rem; }
  .juara-label { font-size: .9rem; }
  .juara-skor { gap: .5rem; }
  .juara-skor > div { min-width: 0; flex: 1; padding: .3rem .6rem; }
  .juara-skor small { font-size: .78rem; }
  .juara-skor b { font-size: 2.2rem; }
  .juara-aksi { flex-wrap: wrap; gap: .5rem; }
  .juara-aksi .btn { flex: 1 1 auto; }
  .juara-tabel { max-height: 40vh; overflow: auto; }
  .juara-tabel .tabel { display: table; min-width: 32rem; }
}

/* =====================================================================
   LAPISAN HP (dimuat paling akhir di semua media)
   Layar PID/laptop tidak berubah. Di HP (lebar ≤ 760 px) dan HP
   mendatar (tinggi ≤ 500 px) halaman menjadi satu kolom yang dapat
   digulir, bilah atas membungkus, dan target sentuh 44–48 px.
   ===================================================================== */
@media (max-width: 760px), (max-height: 500px) and (max-width: 1100px) {
  html { font-size: 15px; }
  :root { --sentuh: 46px; --bar: 56px; }
  html, body { height: auto; min-height: 100%; }
  body { overflow-x: hidden; overflow-y: auto; -webkit-text-size-adjust: 100%; }
  /* layar aktif ikut alur dokumen agar dapat digulir */
  .screen.on { position: relative; inset: auto; min-height: 100vh; min-height: 100svh; transform: none; }
  .screen:not(.on) { pointer-events: none; }
  /* bilah atas */
  .topbar { height: auto; min-height: var(--bar); flex-wrap: wrap; gap: .4rem; padding: .4rem .6rem; padding-right: calc(46px + 1rem); position: sticky; top: 0; z-index: 40; }
  .topbar .brand { min-width: 0; flex: 1 1 auto; gap: .45rem; }
  .topbar .brand svg { width: 34px; height: 34px; flex: none; }
  .topbar .brand > div { min-width: 0; }
  .topbar .brand b { font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .brand small { font-size: .74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .topbar .spacer { display: none; }
  .topbar .iconbtn, .topbar a.iconbtn { width: 40px; height: 40px; border-radius: .7rem; }
  .topbar .btn-fs { display: none; }
  .topbar .btn.kecil { min-height: 40px; padding: .2rem .7rem; font-size: .85rem; }
  .topbar .gear-ruang { display: none; }
  .topbar .mode-seg, .topbar .seg { order: 20; flex: 1 1 100%; margin: 0; display: flex; overflow-x: auto; scrollbar-width: none; }
  .topbar .mode-seg::-webkit-scrollbar, .topbar .seg::-webkit-scrollbar { display: none; }
  .topbar .mode-seg button, .topbar .seg button { flex: 1 0 auto; min-height: 40px; font-size: .9rem; padding: 0 .8rem; white-space: nowrap; }
  #gear { top: 8px; right: 8px; width: 42px; height: 42px; }
  .judul-alat { top: 8px !important; right: calc(42px + 1rem) !important; gap: .35rem !important; }
  .judul-alat .iconbtn, .judul-alat a.iconbtn { width: 40px; height: 40px; }
  .judul-alat .btn-fs { display: none; }
  /* media Lab Maya: mode aktif sebagai blok biasa */
  .lab-main { flex: none; position: relative; }
  .mode { position: relative; inset: auto; padding: .8rem .75rem 1.6rem; }
  .mode:not(.on) { display: none !important; }
  /* layar pembuka */
  .intro { position: fixed; overflow-y: auto; place-items: start center; padding: 1rem .8rem; }
  .intro-kartu { grid-template-columns: 1fr; gap: 1rem; padding: 1.2rem 1.2rem 1.4rem; border-radius: 1.4rem; width: 100%; }
  .intro-kartu h1 { font-size: 2.3rem; }
  .intro-ilus { max-width: 13rem; margin: 0 auto; }
  .intro-catatan { font-size: .95rem; padding: .7rem .9rem; }
  /* tombol */
  .btn { min-height: 44px; font-size: .95rem; padding: .4rem 1rem; }
  .btn.besar { min-height: 50px; font-size: 1.05rem; padding: .5rem 1.2rem; }
  .btn.mega { font-size: 1.35rem; min-height: 58px; padding: .5rem 1.8rem; }
  .btn.kecil { min-height: 40px; font-size: .88rem; padding: .25rem .8rem; }
  .iconbtn { width: 44px; height: 44px; }
  .iconbtn.kecil { width: 40px; height: 40px; }
  .chip { min-height: 40px; font-size: .88rem; padding: .25rem .8rem; }
  .chip.besar { max-width: none; }
  .seg button { min-height: 40px; padding: 0 .8rem; font-size: .9rem; }
  .inp { font-size: 1rem; min-height: 44px; padding: .45rem .8rem; border-width: 2px; }
  /* modal, toast, Panel Guru */
  #modal { padding: .6rem; align-items: center; }
  .modal-box, .modal-box.lebar { width: 100%; max-height: 92vh; max-height: 92svh; border-radius: 1.2rem; }
  .modal-head { padding: .7rem 1rem; }
  .modal-head h2 { font-size: 1.15rem; }
  .modal-isi { padding: .9rem 1rem; }
  .modal-aksi { flex-wrap: wrap; gap: .5rem; padding: .7rem 1rem; }
  .modal-aksi .btn { flex: 1 1 auto; }
  #toast { font-size: .92rem; padding: .7rem 1rem; max-width: 94vw; bottom: 1rem; }
  .guru-box { width: 100vw; height: 100vh; height: 100svh; border-radius: 0; }
  .guru-head { padding: .6rem .8rem; padding-right: calc(42px + 1.4rem); gap: .5rem; flex-wrap: wrap; }
  .guru-head h2 { font-size: 1.05rem; }
  .guru-head .status { display: none; }
  .guru-tubuh { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .guru-nav { flex-direction: row; overflow-x: auto; padding: .5rem; gap: .3rem; }
  .guru-nav button { flex: none; min-height: 40px; padding: 0 .8rem; font-size: .88rem; }
  .guru-isi { padding: 1rem .9rem 2.5rem; }
  /* sampul permainan duel */
  .duel-sampul, .det-sampul, .ba-sampul { place-items: start center; padding: 4.2rem .6rem 1.2rem; overflow-y: auto; }
  .st-kartu { width: 100%; padding: 1.4rem 1rem 1rem; border-radius: 1.4rem; }
  .st-ikon { width: 4.6rem; height: 4.6rem; margin: -3.4rem auto .2rem; }
  .st-kartu h1 { font-size: 2.2rem; }
  .st-sub { font-size: .98rem; }
  .st-tim-baris { grid-template-columns: 1fr; gap: .5rem; }
  .st-vs { font-size: 1.6rem; }
  .st-opsi-baris { gap: .8rem; }
  .st-opsi .seg button { min-width: 4rem; font-size: .95rem; }
  .duel-main { grid-template-columns: 1fr; gap: .8rem; padding: .7rem; flex: none; }
  .timer-wadah { width: 6.5rem; height: 6.5rem; }
  .tc-angka { font-size: 2.3rem; }
  .tim-kepala { min-height: 3.2rem; padding: .35rem .5rem .35rem .9rem; gap: .6rem; }
  .tim-kepala .tk-nama { font-size: 1.15rem; }
  .tim-kepala .tk-skor { min-width: 3.6rem; height: 2.6rem; font-size: 1.6rem; }
  .pil-ronde { font-size: .9rem; padding: .2rem .7rem; order: 15; }
  .juara-kartu { width: 100%; padding: 1rem .9rem 1.2rem; }
  .juara-kartu h1 { font-size: 2.2rem; }
  /* tabel lebar dapat digeser */
  .tabel-wadah { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tabel { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; font-size: .85rem; }
  .tabel th, .tabel td { padding: .45rem .6rem; }
  .tabel td { white-space: normal; min-width: 4.5rem; }
  .kosong-besar { padding: 1.4rem 1rem; }
  .kosong-besar h3 { font-size: 1.15rem; }
}
/* HP mendatar: tetap dapat digulir, kartu pembuka dua kolom */
@media (max-height: 500px) and (min-width: 600px) and (max-width: 1100px) {
  .intro-kartu { grid-template-columns: .7fr 1.3fr; }
  .st-tim-baris { grid-template-columns: 1fr auto 1fr; }
}

/* =====================================================================
   G3 · DETEKTIF PETUNJUK VISUAL — gaya khusus
   ===================================================================== */
/* sampul */
.det-sampul { display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 30% 20%, #E5F5F2, #FFF8EE 55%, #FBEBD3); }
.det-latar { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.det-latar i { position: absolute; top: 110%; width: calc(5rem * var(--s)); height: calc(5rem * var(--s)); border-radius: 50%; border: .5rem solid rgba(42, 157, 143, .18); animation: naikLup 22s linear infinite; }
.det-latar i::after { content: ""; position: absolute; right: -1.6rem; bottom: -1.6rem; width: 2rem; height: .55rem; border-radius: 1rem; background: rgba(42, 157, 143, .18); transform: rotate(45deg); }
@keyframes naikLup { to { transform: translateY(-140vh) rotate(40deg); } }
.det-sampul .judul-alat { right: calc(var(--sentuh) + 2.4rem); }
.det-kartu { width: min(64rem, 92vw); }
.lup-gerak { transform-origin: 42px 42px; animation: lupGerak 3.2s ease-in-out infinite; }
@keyframes lupGerak { 0%, 100% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(8px, -4px) rotate(8deg); } 50% { transform: translate(2px, 6px) rotate(-4deg); } 75% { transform: translate(-6px, -2px) rotate(-8deg); } }
.det-form { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1.2rem; align-items: end; text-align: left; margin-bottom: .9rem; }
.det-nama { display: flex; flex-direction: column; gap: .35rem; }
.det-nama b, .det-pilih-judul { color: var(--teks2); font-weight: 800; }
.det-pilih-judul { text-align: left; margin-bottom: .4rem; }
.det-chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .8rem; margin-bottom: 1.1rem; }
.det-chip { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: .1rem; padding: .5rem .5rem .6rem; border-radius: 1.1rem; border: 4px solid var(--garis); background: #fff; text-align: left; transition: all .2s; opacity: .6; }
.det-chip.on { border-color: var(--teal); opacity: 1; box-shadow: var(--bayang); }
.dc-gambar { width: 100%; aspect-ratio: 16 / 9; border-radius: .7rem; overflow: hidden; display: block; background: #eee; margin-bottom: .3rem; }
.dc-gambar svg, .dc-gambar img { width: 100%; height: 100%; display: block; object-fit: cover; }
.det-chip b { font-size: 1.1rem; padding-left: .3rem; }
.det-chip small { color: var(--teks2); font-weight: 700; padding-left: .3rem; }
.dc-cek { position: absolute; top: .9rem; right: .9rem; width: 2.2rem; height: 2.2rem; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; transform: scale(0); transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.det-chip.on .dc-cek { transform: scale(1); }
.dc-cek .ic { width: 60%; height: 60%; }
.det-top { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .3rem .9rem; font-size: .95rem; color: var(--teks2); }
.det-top .ic { color: var(--oranye); }
.dt-item b { color: var(--navy); }

/* permainan */
.det-main { background: linear-gradient(180deg, #E3F3F6, var(--krem) 50%); }
.det-tata { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 21rem; gap: 1.1rem; padding: 1rem 1.3rem 1.1rem; }
.adegan-bingkai { position: relative; min-height: 0; min-width: 0; display: grid; place-items: center; }
.adegan { position: relative; border-radius: 1.4rem; overflow: hidden; box-shadow: var(--bayang-kuat); background: #fff; touch-action: none; cursor: none; user-select: none; }
.adegan.tinjau { cursor: default; }
.lapis-gambar, .lapis-gambar .gambar-adegan { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.lapis-gambar img { object-fit: fill; }
.lapis-tanda { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.adegan.detak { animation: detakTepi .5s ease-out; }
@keyframes detakTepi { 0% { box-shadow: inset 0 0 0 0 rgba(231, 76, 60, 0), var(--bayang-kuat); } 30% { box-shadow: inset 0 0 6rem 1rem rgba(231, 76, 60, .45), 0 0 0 .4rem rgba(231, 76, 60, .5); } 100% { box-shadow: inset 0 0 0 0 rgba(231, 76, 60, 0), var(--bayang-kuat); } }
.adegan.detak::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 7rem 1rem rgba(231, 76, 60, .4); animation: kedipDetak .5s ease-out both; }
@keyframes kedipDetak { from { opacity: 1; } to { opacity: 0; } }

/* lensa */
.lensa { position: absolute; left: 0; top: 0; width: 15rem; height: 15rem; border-radius: 50%; overflow: hidden; pointer-events: none; z-index: 5; border: .55rem solid #1D3557; box-shadow: 0 0 0 .3rem #fff, 0 1rem 2.4rem rgba(29, 53, 87, .45); opacity: 0; transition: opacity .15s; background: #fff; }
.lensa.on { opacity: 1; }
.lensa::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .45), transparent 40%); }
.lensa-isi { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.lensa-isi .gambar-adegan { width: 100%; height: 100%; display: block; }
.lensa-silang { position: absolute; left: 50%; top: 50%; width: 2.2rem; height: 2.2rem; margin: -1.1rem; z-index: 2; }
.lensa-silang::before, .lensa-silang::after { content: ""; position: absolute; background: rgba(231, 111, 81, .9); border-radius: 2px; }
.lensa-silang::before { left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; }
.lensa-silang::after { top: 50%; left: 0; right: 0; height: 3px; margin-top: -1.5px; }

/* tanda petunjuk */
.tanda .t-garis { fill: rgba(46, 204, 113, .12); stroke: #2ECC71; stroke-width: 7; }
.tanda .t-riak { fill: none; stroke: #2ECC71; stroke-width: 5; transform-box: fill-box; transform-origin: center; animation: riakTanda 1.6s ease-out infinite; }
.tanda-isi { transform-box: fill-box; transform-origin: center; }
.tanda.temu .tanda-isi, .tanda.lewat .tanda-isi { animation: munculTanda .45s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes munculTanda { from { transform: scale(.2); opacity: 0; } }
@keyframes riakTanda { from { transform: scale(1); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
.tanda .t-no circle { fill: #2ECC71; stroke: #fff; stroke-width: 4; }
.tanda .t-no text { fill: #fff; font-weight: 900; font-size: 22px; font-family: var(--font); }
.tanda.lewat .t-garis { fill: rgba(231, 111, 81, .14); stroke: #E76F51; stroke-dasharray: 14 8; }
.tanda.lewat .t-riak { stroke: #E76F51; }
.tanda.lewat .t-no circle { fill: #E76F51; }
.tanda.ed .t-garis { fill: rgba(244, 162, 97, .2); stroke: #F4A261; }
.tanda.ed .t-riak { display: none; }
.tanda.ed .t-no circle { fill: #F4A261; }
.tanda.bantu .b-isi { fill: rgba(244, 197, 66, .18); }
.tanda.bantu .b-garis { fill: none; stroke: #F4C542; stroke-width: 8; stroke-dasharray: 20 14; animation: alir 1s linear infinite; }

/* kartu temuan & teks melayang */
.kartu-temuan { position: absolute; z-index: 6; width: 22rem; transform: translate(-50%, calc(-100% - 2.4rem)); background: #fff; border-radius: 1.2rem; padding: .8rem 1.1rem; box-shadow: var(--bayang-kuat); border-top: .55rem solid #2ECC71; pointer-events: none; animation: kartuMasuk .4s cubic-bezier(.3, 1.5, .5, 1) both; }
.kartu-temuan.bawah { transform: translate(-50%, 2.4rem); }
.kartu-temuan small { font-weight: 900; color: #1E8E4E; text-transform: uppercase; letter-spacing: .05em; font-size: .78rem; }
.kartu-temuan b { display: block; font-size: 1.3rem; font-weight: 900; }
.kartu-temuan p { margin: .2rem 0 0; font-size: 1rem; color: var(--teks2); }
.kartu-temuan.pergi { opacity: 0; transition: opacity .4s; }
@keyframes kartuMasuk { from { opacity: 0; scale: .6; } }
.terbang-salah { position: absolute; z-index: 6; transform: translate(-50%, -50%); font-weight: 900; font-size: 1.7rem; color: var(--salah); text-shadow: 0 0 .5rem #fff, 0 0 .2rem #fff; pointer-events: none; animation: terbang 1s ease-out both; }

/* pesan tengah */
.pesan-adegan { position: absolute; inset: 0; display: none; place-items: center; pointer-events: none; z-index: 7; }
.pesan-adegan.on { display: grid; }
.hitung { font-size: 11rem; font-weight: 900; color: #fff; text-shadow: 0 .5rem 0 var(--navy), 0 0 3rem rgba(29, 53, 87, .5); animation: hitungMasuk .6s cubic-bezier(.2, 1.4, .4, 1) both; }
.hitung.cari { color: var(--oranye); font-size: 8rem; }
@keyframes hitungMasuk { 0% { transform: scale(2.4); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1); } }
.pesan-besar { background: var(--navy); color: #fff; border-radius: 1.6rem; padding: 1.2rem 2.6rem; text-align: center; box-shadow: var(--bayang-kuat); animation: bintang .5s cubic-bezier(.2, .9, .3, 1.3) both; }
.pesan-besar b { display: block; font-size: 3rem; font-weight: 900; }
.pesan-besar small { font-size: 1.2rem; font-weight: 800; color: var(--oranye); }

/* samping */
.det-samping { display: flex; flex-direction: column; gap: .8rem; min-height: 0; overflow: auto; padding-bottom: .3rem; }
.det-pemain { display: flex; align-items: center; gap: .5rem; background: var(--navy); color: #fff; border-radius: 1rem; padding: .55rem .9rem; font-size: 1.1rem; }
.det-pemain b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.det-baris-atas { display: grid; grid-template-columns: auto 1fr; gap: .8rem; align-items: center; }
.det-samping .timer-wadah { width: 7.6rem; height: 7.6rem; margin: 0; }
.det-samping .tc-angka { font-size: 2.8rem; }
.timer-wadah.getar { animation: getar .35s; }
.det-skor { background: #fff; border-radius: 1.2rem; box-shadow: var(--bayang); display: flex; flex-direction: column; align-items: flex-start; padding: .5rem 1.1rem; }
.det-skor small { font-weight: 800; color: var(--teks2); }
.det-skor b { font-size: 2.4rem; font-weight: 900; color: var(--teal-d); font-variant-numeric: tabular-nums; }
.det-skor b.pop { animation: pop .45s; }
.det-daftar-judul { display: flex; justify-content: space-between; align-items: baseline; font-size: 1.05rem; }
.det-daftar-judul span { font-weight: 900; color: var(--teal-d); font-size: 1.2rem; }
.det-slot { display: flex; flex-direction: column; gap: .4rem; }
.slot { display: flex; align-items: center; gap: .6rem; background: #fff; border: 3px dashed var(--garis); border-radius: .9rem; padding: .35rem .6rem; min-height: 2.9rem; transition: all .3s; }
.slot-no { width: 1.9rem; height: 1.9rem; border-radius: 50%; background: var(--krem2); color: var(--teks2); font-weight: 900; display: grid; place-items: center; flex: none; }
.slot-no .ic { width: 70%; height: 70%; }
.slot-teks { font-weight: 800; color: var(--teks2); }
.slot.temu { border: 3px solid #2ECC71; background: #EAFBF1; animation: pop .45s; }
.slot.temu .slot-no { background: #2ECC71; color: #fff; }
.slot.temu .slot-teks { color: var(--navy); }
.det-aksi { margin-top: auto; display: flex; flex-direction: column; gap: .5rem; }
.tinjau-kepala b { display: block; font-size: 1.4rem; font-weight: 900; }
.tinjau-kepala small { color: var(--teks2); font-weight: 800; }
.tinjau-daftar { display: flex; flex-direction: column; gap: .45rem; overflow: auto; }
.tinjau-item { display: flex; gap: .6rem; background: #fff; border-radius: .9rem; padding: .5rem .7rem; border-left: .5rem solid #2ECC71; box-shadow: var(--bayang); animation: masukAtas .35s both; }
.tinjau-item.lewat { border-left-color: var(--koral); background: #FFF4EF; }
.tinjau-item p { margin: 0; font-size: .85rem; color: var(--teks2); }
.ti-ikon { width: 1.8rem; height: 1.8rem; border-radius: 50%; display: grid; place-items: center; background: #2ECC71; color: #fff; flex: none; }
.tinjau-item.lewat .ti-ikon { background: var(--koral); }
.ti-ikon .ic { width: 65%; height: 65%; }
.det-samping .btn-lanjut { margin-top: auto; }

/* refleksi */
.refleksi { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: rgba(15, 25, 45, .6); padding: 2vh 2vw; }
.refleksi.on { display: grid; animation: muncul .3s both; }
.rf-kartu { width: min(72rem, 94vw); max-height: 94vh; overflow: auto; background: #fff; border-radius: 2rem; padding: 2rem 2.6rem; box-shadow: var(--bayang-kuat); text-align: center; animation: bintang .5s cubic-bezier(.2, .9, .3, 1.2) both; }
.rf-label { font-weight: 900; text-transform: uppercase; letter-spacing: .1em; color: var(--oranye); }
.rf-tanya { font-size: 3.6rem; font-weight: 900; line-height: 1.1; margin: .6rem auto 1.6rem; max-width: 52rem; }
.rf-pilih { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem; }
.rf-btn { display: flex; align-items: center; justify-content: center; gap: .8rem; min-height: 7rem; border-radius: 1.6rem; font-size: 2rem; font-weight: 900; color: #fff; box-shadow: var(--bayang); transition: transform .15s; }
.rf-btn:active { transform: scale(.96); }
.rf-btn .ic { width: 2.6rem; height: 2.6rem; }
.rf-btn.cukup { background: var(--teal); }
.rf-btn.belum { background: var(--koral); }
.rf-kartu h2 { font-size: 3rem; font-weight: 900; color: var(--koral); margin: .3rem 0 .4rem; }
.rf-lead { font-size: 1.25rem; }
.rf-daftar { text-align: left; columns: 2; gap: 2rem; font-size: 1rem; margin: .4rem 0 1rem; padding-left: 1.2rem; }
.rf-daftar li { break-inside: avoid; margin-bottom: .35rem; }
.rf-saran { text-align: left; background: #EAF6F4; border-left: .6rem solid var(--teal); border-radius: 1rem; padding: .8rem 1.2rem; margin-bottom: .8rem; }
.rf-saran > b { display: flex; align-items: center; gap: .4rem; color: var(--teal-d); font-size: 1.15rem; }
.rf-saran ol { margin: .3rem 0 0; padding-left: 1.4rem; font-size: 1.05rem; }
.rf-polling { display: flex; align-items: center; justify-content: center; gap: .5rem; color: var(--teks2); font-weight: 800; margin-bottom: 1rem; }

/* hasil */
.hasil-kartu h1 { color: var(--navy); }
.hasil-bintang { display: flex; justify-content: center; gap: .6rem; }
.hasil-bintang span { width: 5rem; height: 5rem; display: block; animation: bintang .6s cubic-bezier(.2, .9, .3, 1.5) both; }
.hasil-bintang span:nth-child(2) { width: 6.2rem; height: 6.2rem; margin-top: -1rem; }
.hasil-bintang svg { width: 100%; height: 100%; }
.hasil-angka { display: flex; justify-content: center; gap: 1rem; margin-bottom: 1rem; }
.hasil-angka > div { min-width: 10rem; background: var(--krem); border-radius: 1.2rem; padding: .4rem 1rem; }
.hasil-angka small { display: block; font-weight: 800; color: var(--teks2); }
.hasil-angka b { font-size: 2.6rem; font-weight: 900; color: var(--teal-d); font-variant-numeric: tabular-nums; }
.hasil-tata { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem; text-align: left; }
.hasil-tata h3 { margin: 0 0 .3rem; }
.hasil-tata .tabel td, .hasil-tata .tabel th { padding: .45rem .7rem; }
.tabel-peringkat tr.sorot td { background: #FFF1E3; font-weight: 900; }

/* panel guru */
.guru-adegan { display: flex; flex-direction: column; gap: .7rem; margin-top: .6rem; }
.ga-item { display: grid; grid-template-columns: 10rem 1fr auto auto auto; gap: 1rem; align-items: center; background: #fff; border-radius: 1rem; padding: .5rem .8rem; box-shadow: var(--bayang); }
.ga-item.mati { opacity: .55; }
.ga-gambar { aspect-ratio: 16 / 9; border-radius: .6rem; overflow: hidden; background: #eee; }
.ga-gambar svg, .ga-gambar img { width: 100%; height: 100%; display: block; object-fit: cover; }
.ga-info b { display: block; font-size: 1.1rem; }
.ga-info small { color: var(--teks2); font-weight: 700; }
.ed-kepala { display: flex; gap: .8rem; align-items: center; margin-bottom: .4rem; }
.ed-nama { font-weight: 900; max-width: 26rem; }
.ed-adegan { position: relative; width: min(100%, calc(56vh * var(--ar))); aspect-ratio: var(--ar); border-radius: 1rem; overflow: hidden; box-shadow: var(--bayang); cursor: crosshair; }
.ed-adegan .gambar-adegan { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ed-daftar { font-size: .95rem; margin-top: .8rem; }
.st-opsi.kiri { align-items: flex-start; margin: 1rem 0; }

@media (max-aspect-ratio: 4/3) {
  .det-tata { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .det-form, .hasil-tata { grid-template-columns: 1fr; }
}

.medali { display: inline-grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; font-weight: 900; }
.medali.m1 { background: #F4C542; color: #1D3557; box-shadow: 0 0 0 3px #E0A82E inset; }
.medali.m2 { background: #D9DEE6; color: #1D3557; box-shadow: 0 0 0 3px #AEB6C2 inset; }
.medali.m3 { background: #E3A673; color: #fff; box-shadow: 0 0 0 3px #B87443 inset; }

/* ================= HP ================= */
@media (max-width: 760px), (max-height: 500px) and (max-width: 1100px) {
  .det-tata { flex: none; grid-template-columns: 1fr; grid-template-rows: auto auto; gap: .7rem; padding: .6rem; }
  .det-tata > * { min-width: 0; }

  .det-chips { grid-template-columns: 1fr 1fr; gap: .5rem; }
  .det-sampul .st-kartu { padding-top: 1.6rem; }
  .rf-kartu { padding: 1.2rem 1rem; border-radius: 1.3rem; width: 100%; }
  .rf-tanya { font-size: 1.6rem; margin: .4rem auto 1rem; }
  .rf-pilih { gap: .6rem; }
  .rf-btn { min-height: 4.2rem; font-size: 1.15rem; gap: .4rem; border-radius: 1.1rem; }
  .rf-btn .ic { width: 1.6rem; height: 1.6rem; }
  .rf-kartu h2 { font-size: 1.7rem; }
  .rf-lead { font-size: 1rem; }
  .rf-daftar { columns: 1; font-size: .9rem; }
  .rf-saran ol { font-size: .9rem; }
  .hasil-angka { gap: .4rem; }
  .hasil-angka > div { min-width: 0; flex: 1; padding: .3rem .5rem; }
  .hasil-angka b { font-size: 1.6rem; }
  .hasil-angka small { font-size: .72rem; }
  .hasil-bintang span { width: 3.4rem; height: 3.4rem; }
  .hasil-bintang span:nth-child(2) { width: 4.2rem; height: 4.2rem; }
  .ga-item { grid-template-columns: 1fr auto auto; }
}


.menu-proyek { position: relative; flex: none; }
.menu-proyek > summary { list-style: none; cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: .4rem; min-height: 44px; padding: .3rem .9rem; border-radius: 999px; background: var(--krem); color: var(--navy); font-weight: 800; }

.menu-proyek > nav { position: absolute; top: calc(100% + .4rem); left: 0; z-index: 70; min-width: 15rem; max-width: 80vw; background: #fff; border-radius: 1rem; box-shadow: var(--bayang-kuat); padding: .5rem; display: grid; gap: .2rem; }

.menu-proyek .menu-catatan { margin: .2rem .4rem .4rem; padding: .6rem .8rem; border-radius: .7rem; background: #fff1cd; color: #183448; font-size: .9rem; line-height: 1.4; }
@media (max-width: 760px) { .menu-proyek { position: static; } .menu-proyek > summary span { display: none; } .menu-proyek > nav { left: .5rem; right: .5rem; top: 100%; min-width: 0; max-width: none; } }
</style>

<script>
/* =====================================================================
   Bagian 3: ADEGAN ILUSTRASI SVG FIKTIF (1600 × 900)
   Semua nama tempat, plat, dan tokoh fiktif.
   ===================================================================== */
const AW = 1600, AH = 900;
const T = (x, y, teks, o = {}) => `<text x="${x}" y="${y}" font-family="Nunito, 'Segoe UI', sans-serif" font-weight="${o.w || 900}" font-size="${o.s || 20}" fill="${o.f || '#1D3557'}" text-anchor="${o.a || 'middle'}"${o.ls ? ` letter-spacing="${o.ls}"` : ''}${o.tr ? ` transform="${o.tr}"` : ''}>${teks}</text>`;
function awan(x, y, s = 1) { return `<g transform="translate(${x} ${y}) scale(${s})" fill="#fff" opacity=".9"><ellipse cx="0" cy="0" rx="60" ry="26"/><ellipse cx="40" cy="-14" rx="44" ry="30"/><ellipse cx="-38" cy="-8" rx="34" ry="22"/></g>`; }
function pohon(x, y, s = 1, w = '#6DB57F') { return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-9" y="-70" width="18" height="70" rx="5" fill="#8D6E4A"/><circle cx="0" cy="-104" r="52" fill="${w}"/><circle cx="-34" cy="-84" r="34" fill="${w}"/><circle cx="34" cy="-80" r="36" fill="${w}"/><circle cx="12" cy="-126" r="30" fill="#83C48F" opacity=".8"/></g>`; }
/* tokoh flat; logo opsional di saku */
function orang(x, y, o = {}) {
  const s = o.s || 1, kulit = o.kulit || '#E0AC69', baju = o.baju || '#fff', celana = o.celana || '#5A6B85', rambut = o.rambut || '#2B2B2B', k = o.balik ? -1 : 1;
  return `<g transform="translate(${x} ${y}) scale(${s * k} ${s})">
    <rect x="-17" y="-78" width="13" height="78" rx="6" fill="${celana}"/><rect x="4" y="-78" width="13" height="78" rx="6" fill="${celana}"/>
    <rect x="-22" y="-4" width="20" height="8" rx="4" fill="#333"/><rect x="2" y="-4" width="20" height="8" rx="4" fill="#333"/>
    <path d="M-26 -78 Q-28 -140 0 -142 Q28 -140 26 -78Z" fill="${baju}" stroke="rgba(0,0,0,.12)" stroke-width="2"/>
    <rect x="-38" y="-136" width="12" height="54" rx="6" fill="${baju}" stroke="rgba(0,0,0,.1)" stroke-width="2" transform="rotate(8 -32 -136)"/>
    <rect x="26" y="-136" width="12" height="54" rx="6" fill="${baju}" stroke="rgba(0,0,0,.1)" stroke-width="2" transform="rotate(-8 32 -136)"/>
    ${o.dasi ? `<path d="M-4 -140 L4 -140 L6 -110 L0 -102 L-6 -110Z" fill="${o.dasi}"/>` : ''}
    ${o.logo ? `<g transform="translate(-14 -124)"><path d="M0 -8 L7 -5 L7 2 Q7 8 0 10 Q-7 8 -7 2 L-7 -5Z" fill="#1D3557"/><path d="M0 -4 L3.5 0 L0 5 L-3.5 0Z" fill="#F4A261"/></g>` : ''}
    ${o.nomor ? `<rect x="-17" y="-128" width="34" height="26" rx="3" fill="#fff" stroke="#1D3557" stroke-width="1.5"/>${T(0, -118, o.nomor[0], { s: 5.5 })}${T(0, -109, o.nomor[1], { s: 9 })}` : ''}
    <rect x="-6" y="-152" width="12" height="12" fill="${kulit}"/>
    <circle cx="0" cy="-170" r="22" fill="${kulit}"/>
    <path d="M-23 -172 Q-22 -198 0 -196 Q24 -196 23 -170 Q12 -184 -23 -172Z" fill="${rambut}"/>
    ${o.jilbab ? `<path d="M-25 -168 Q-26 -200 0 -199 Q26 -200 25 -168 L28 -140 Q0 -128 -28 -140Z" fill="${o.jilbab}"/><circle cx="0" cy="-168" r="17" fill="${kulit}"/>` : ''}
    <circle cx="7" cy="-170" r="2.6" fill="#1D3557"/><path d="M4 -160 Q9 -157 13 -161" stroke="#1D3557" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>`;
}
function plat(x, y, teks, s = 1) { return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-46" y="-13" width="92" height="26" rx="3" fill="#1D1D1D" stroke="#ddd" stroke-width="2"/>${T(0, 6, teks, { s: 15, f: '#fff', w: 800 })}</g>`; }

const ADEGAN_SVG = {
  /* ---------- (a) Depan sekolah ---------- */
  sekolah() {
    return `<defs><linearGradient id="lgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FD8EE"/><stop offset="1" stop-color="#E8F6FB"/></linearGradient></defs>
    <rect width="1600" height="900" fill="url(#lgA)"/>
    ${awan(220, 110, 1.1)}${awan(860, 80, .8)}${awan(1420, 150, .9)}
    <path d="M0 470 Q200 380 420 440 T880 430 T1300 420 T1600 440 V600 H0Z" fill="#B9DDA0"/>
    <!-- menara air -->
    <g transform="translate(1330 120)">
      <path d="M-50 330 L-26 90 M50 330 L26 90 M-40 230 L40 170 M40 230 L-40 170 M-46 290 L46 230 M46 290 L-46 230" stroke="#7A8A99" stroke-width="7" fill="none"/>
      <rect x="-64" y="0" width="128" height="96" rx="14" fill="#E76F51"/>
      <rect x="-64" y="26" width="128" height="16" fill="#fff"/><rect x="-64" y="60" width="128" height="16" fill="#fff"/>
      <path d="M-72 2 L0 -50 L72 2Z" fill="#2A9D8F"/><circle cx="0" cy="-54" r="8" fill="#F4C542"/>
      ${T(0, 56, 'KP', { s: 26, f: '#1D3557' })}
    </g>
    <!-- gedung sekolah -->
    <rect x="360" y="220" width="820" height="300" fill="#FFF1D6" stroke="#E5CFA4" stroke-width="4"/>
    <path d="M330 226 L770 120 L1210 226Z" fill="#C8553D"/>
    ${[0, 1, 2, 3, 4, 5, 6].map(i => `<rect x="${400 + i * 110}" y="260" width="70" height="80" rx="6" fill="#9FD3EA" stroke="#fff" stroke-width="5"/><rect x="${400 + i * 110}" y="380" width="70" height="80" rx="6" fill="#9FD3EA" stroke="#fff" stroke-width="5"/>`).join('')}
    <rect x="730" y="400" width="80" height="120" fill="#8D6E4A"/>
    <rect x="680" y="166" width="180" height="40" rx="8" fill="#fff" stroke="#1D3557" stroke-width="3"/>${T(770, 194, 'SELAMAT DATANG', { s: 17 })}
    <!-- pagar & spanduk -->
    <rect x="0" y="560" width="1600" height="16" fill="#5A6B85"/>
    ${Array.from({ length: 40 }, (_, i) => `<rect x="${i * 41 + 6}" y="500" width="8" height="70" fill="#5A6B85"/>`).join('')}
    <rect x="0" y="508" width="1600" height="8" fill="#5A6B85"/>
    <g transform="translate(1010 470)"><rect x="0" y="0" width="300" height="78" fill="#E63946" stroke="#fff" stroke-width="4"/>${T(150, 30, 'HUT KELURAHAN BIT', { s: 19, f: '#fff' })}${T(150, 58, 'Ke-40 · Bersih, Hijau, Juara', { s: 15, f: '#FFE8A3', w: 800 })}</g>
    <!-- gerbang & papan nama -->
    <rect x="560" y="370" width="44" height="210" fill="#E9D8B4" stroke="#C9B48A" stroke-width="4"/><rect x="936" y="370" width="44" height="210" fill="#E9D8B4" stroke="#C9B48A" stroke-width="4"/>
    <rect x="540" y="330" width="460" height="64" rx="10" fill="#1D3557"/>
    ${T(770, 368, 'SMA KOTA PIKSEL', { s: 30, f: '#fff', ls: 3 })}${T(770, 388, 'Jl. Kisi Raya No. 8', { s: 13, f: '#F4C542', w: 800 })}
    <g transform="translate(560 350)"><path d="M0 -12 L10 -8 L10 2 Q10 10 0 13 Q-10 10 -10 2 L-10 -8Z" fill="#F4A261"/></g>
    <!-- trotoar & jalan -->
    <rect x="0" y="576" width="1600" height="80" fill="#D9D2C3"/>
    ${Array.from({ length: 20 }, (_, i) => `<rect x="${i * 80}" y="576" width="2" height="80" fill="#C2B9A6"/>`).join('')}
    <rect x="0" y="656" width="1600" height="244" fill="#6B7280"/>
    ${Array.from({ length: 10 }, (_, i) => `<rect x="${i * 170 + 30}" y="772" width="90" height="10" rx="5" fill="#F2F2F2"/>`).join('')}
    <!-- rambu nama jalan -->
    <g transform="translate(180 330)"><rect x="-5" y="0" width="10" height="290" fill="#8A96A3"/><rect x="-92" y="-6" width="184" height="48" rx="6" fill="#1E7F4F" stroke="#fff" stroke-width="3"/>${T(0, 27, 'Jl. Kisi Raya', { s: 22, f: '#fff' })}<rect x="-70" y="44" width="140" height="22" rx="4" fill="#1E7F4F" stroke="#fff" stroke-width="2"/>${T(0, 60, 'Kel. Bit', { s: 13, f: '#fff', w: 800 })}</g>
    ${pohon(80, 600, 1.1)}${pohon(1500, 600, 1.2, '#5FA872')}
    <!-- murid -->
    ${orang(690, 640, { baju: '#fff', celana: '#7A8A99', logo: true, rambut: '#2B2B2B' })}
    ${orang(770, 646, { baju: '#fff', celana: '#7A8A99', jilbab: '#fff', balik: true, kulit: '#C68642' })}
    ${orang(1395, 640, { baju: '#fff', celana: '#7A8A99', dasi: '#7A8A99', s: .95, kulit: '#8D5524' })}
    <!-- angkot -->
    <g transform="translate(330 820)">
      <rect x="-210" y="-150" width="400" height="120" rx="22" fill="#2F6FDB"/><rect x="-190" y="-136" width="110" height="56" rx="8" fill="#BFE3F0"/><rect x="-66" y="-136" width="110" height="56" rx="8" fill="#BFE3F0"/><rect x="58" y="-136" width="110" height="56" rx="8" fill="#BFE3F0"/>
      <rect x="-210" y="-72" width="400" height="18" fill="#fff"/>${T(-10, -58, 'PIKSEL – RASTER', { s: 14, f: '#2F6FDB' })}
      <circle cx="-120" cy="-30" r="34" fill="#222"/><circle cx="-120" cy="-30" r="14" fill="#999"/><circle cx="110" cy="-30" r="34" fill="#222"/><circle cx="110" cy="-30" r="14" fill="#999"/>
      ${plat(232, -60, 'KP 1024 X', .82).replace('translate(232 -60)', 'translate(214 -66)')}
    </g>`;
  },

/* Pembuat elemen ringkas: h('div.kelas#id', {atribut, on:{klik}}, anak...) */
function h(tag, attrs, ...kids) {
  const m = tag.match(/^([a-z0-9]+)?((?:[.#][\w-]+)*)$/i);
  const el = document.createElement(m[1] || 'div');
  (m[2].match(/[.#][\w-]+/g) || []).forEach(t => {
    if (t[0] === '.') el.classList.add(t.slice(1)); else el.id = t.slice(1);
  });
  if (attrs !== undefined && (attrs === null || typeof attrs !== 'object' || attrs instanceof Node || Array.isArray(attrs))) { kids.unshift(attrs); attrs = null; }
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'on') for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'style' && typeof v === 'object') { for (const [sk, sv2] of Object.entries(v)) sk.startsWith('--') ? el.style.setProperty(sk, sv2) : (el.style[sk] = sv2); }
      else if (k in el && k !== 'list' && typeof v !== 'string') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  kids.flat(Infinity).forEach(k => {
    if (k == null || k === false) return;
    el.appendChild(k instanceof Node ? k : document.createTextNode(String(k)));
  });
  return el;
}

/* KUNCI_SIMPAN dan dataBawaan() didefinisikan di berkas data tiap aplikasi */
/* Gabung data tersimpan ke data bawaan (larik diganti utuh) */
function gabung(dasar, baru) {
  if (Array.isArray(dasar) || typeof dasar !== 'object' || dasar === null) return baru === undefined ? dasar : baru;
  const out = { ...dasar };
  if (baru && typeof baru === 'object' && !Array.isArray(baru)) {
    for (const k of Object.keys(baru)) out[k] = (k in dasar) ? gabung(dasar[k], baru[k]) : baru[k];
  }
  return out;
}
function muat() {

    const t = '__uji__'; localStorage.setItem(t, '1'); localStorage.removeItem(t);
    const raw = localStorage.getItem(KUNCI_SIMPAN);
    if (raw) S = gabung(dataBawaan(), JSON.parse(raw));
  } catch (e) { simpanOK = false; }
}

  try {
    localStorage.setItem(KUNCI_SIMPAN, JSON.stringify(S));

/* ---------- Suara (Web Audio API, tanpa berkas audio) ---------- */
const Suara = {
  on: true, ctx: null,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  nada(f, dur = .12, tipe = 'sine', vol = .18, delay = 0, geser = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = tipe; o.frequency.setValueAtTime(f, t);
    if (geser) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + geser), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + .02);
  },
  klik() { this.nada(660, .07, 'triangle', .12); },
  buka() { this.nada(440, .18, 'sine', .14, 0, 300); },

/* ---------- Grafik batang beranimasi (canvas, siap diunduh PNG) ---------- */
function bungkusTeks(ctx, teks, maxW) {
  const kata = String(teks).split(' '), baris = []; let b = '';
  for (const k of kata) { const coba = b ? b + ' ' + k : k; if (ctx.measureText(coba).width > maxW && b) { baris.push(b); b = k; } else b = coba; }
  if (b) baris.push(b); return baris;
}
function rrect(ctx, x, y, w, hh, r) {
  r = Math.max(0, Math.min(r, w / 2, hh / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + hh); ctx.lineTo(x, y + hh); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
/* o = {judul, label:[], seri:[{nama, warna, nilai:[]}], maks, satuan, sub} */
function grafikBatang(cv, o) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.max(320, cv.clientWidth), H = Math.max(240, cv.clientHeight);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const ctx = cv.getContext('2d');
  const fs = Math.max(15, Math.min(W / 46, H / 17, 30));
  const font = (w, s) => `${w} ${s}px Nunito, "Segoe UI", system-ui, sans-serif`;
  const seri = o.seri, n = o.label.length;
  const maks = o.maks || Math.max(1, ...seri.flatMap(s => s.nilai));
  ctx.font = font(700, fs * .9);
  const gwKira = (W - fs * 4.6) / Math.max(1, n);
  const barisLabel = Math.min(3, Math.max(1, ...o.label.map(l => bungkusTeks(ctx, l, gwKira - 8).length)));
  const padL = fs * 3.4, padR = fs * 1.2, padT = fs * (o.judul ? (o.sub ? 3.9 : 2.9) : 1.4) + (seri.length > 1 ? fs * 1.7 : 0) + fs * 1.2, padB = fs * (.9 + 1.12 * barisLabel);
  const pw = W - padL - padR, ph = H - padT - padB;
  const mulai = performance.now(), dur = GERAK_HALUS ? 900 : 1;
  cv._anim && cancelAnimationFrame(cv._anim);
  const gambar = now => {
    const p = Math.min(1, (now - mulai) / dur), e = 1 - Math.pow(1 - p, 3);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
    if (o.judul) {
      ctx.fillStyle = '#1D3557'; ctx.font = font(800, fs * 1.35); ctx.textBaseline = 'top'; ctx.textAlign = 'left';
      ctx.fillText(o.judul, padL * .4, fs * .8);
      if (o.sub) { ctx.font = font(600, fs * .95); ctx.fillStyle = '#5A6B85'; ctx.fillText(o.sub, padL * .4, fs * 2.6); }
    }
    if (seri.length > 1) {
      let x = padL; ctx.font = font(700, fs); ctx.textBaseline = 'middle';
      const y = padT - fs * 1.4;
      seri.forEach(s => { ctx.fillStyle = s.warna; rrect(ctx, x, y - fs * .45, fs * .9, fs * .9, 4); ctx.fill(); ctx.fillStyle = '#1D3557'; ctx.fillText(s.nama, x + fs * 1.3, y); x += fs * 2 + ctx.measureText(s.nama).width + fs * 1.5; });
    }
    /* garis bantu */
    ctx.strokeStyle = '#EDE3D2'; ctx.lineWidth = 1; ctx.font = font(600, fs * .85); ctx.fillStyle = '#5A6B85'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let g = 0; g <= 4; g++) {
      const y = padT + ph - ph * g / 4; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + pw, y); ctx.stroke();
      const v = maks * g / 4; ctx.fillText((Number.isInteger(v) ? v : v.toFixed(1)) + (o.satuan || ''), padL - fs * .5, y);
    }
    const gw = pw / Math.max(1, n), bw = Math.min(fs * 5, gw * .72 / seri.length);
    for (let i = 0; i < n; i++) {
      const gx = padL + gw * i + (gw - bw * seri.length) / 2;
      seri.forEach((s, k) => {
        const v = s.nilai[i] || 0, v0 = (o.dari && o.dari[k] && o.dari[k][i]) || 0, vt = v0 + (v - v0) * e, bh = ph * (vt / maks), x = gx + k * bw, y = padT + ph - bh;
        ctx.fillStyle = s.warna; rrect(ctx, x + 2, y, bw - 4, bh, Math.min(10, bw / 4)); ctx.fill();
        if (p > .5 || o.dari) {
          ctx.globalAlpha = o.dari ? 1 : Math.min(1, (p - .5) * 2); ctx.fillStyle = '#1D3557'; ctx.font = font(800, fs); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          ctx.fillText((o.format ? o.format(v) : v) + (o.satuan || ''), x + bw / 2, y - 4); ctx.globalAlpha = 1;
        }
      });
      ctx.fillStyle = '#1D3557'; ctx.font = font(700, fs * .9); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      bungkusTeks(ctx, o.label[i], gw - 8).slice(0, 3).forEach((ln, j) => ctx.fillText(ln, padL + gw * i + gw / 2, padT + ph + fs * .6 + j * fs * 1.1));
    }
    ctx.strokeStyle = '#1D3557'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + ph); ctx.lineTo(padL + pw, padT + ph); ctx.stroke();
    if (p < 1) cv._anim = requestAnimationFrame(gambar);
  };
  cv._anim = requestAnimationFrame(gambar);
}

/* ---------- Konfeti ---------- */
function konfeti(jumlah = 160) {
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cv.classList.add('on');
  if (!GERAK_HALUS) jumlah = 30;
  const warna = ['#2A9D8F', '#F4A261', '#E76F51', '#2ECC71', '#E9C46A', '#1D3557'];
  const P = Array.from({ length: jumlah }, () => ({ x: Math.random() * cv.width, y: -Math.random() * cv.height * .5, vx: (Math.random() - .5) * 4 * dpr, vy: (2 + Math.random() * 4) * dpr, r: (5 + Math.random() * 7) * dpr, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: warna[Math.floor(Math.random() * warna.length)] }));
  const mulai = performance.now();
  const loop = now => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .04 * dpr; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (now - mulai < 3800) requestAnimationFrame(loop); else { ctx.clearRect(0, 0, cv.width, cv.height); cv.classList.remove('on'); }
  };
  requestAnimationFrame(loop);
}

/* ---------- Kecilkan gambar unggahan agar muat di localStorage ---------- */
function kecilkanGambar(file, maks = 1100, mutu = .78) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, maks / Math.max(img.width, img.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', mutu));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ---------- Timer cincin ---------- */
function buatTimer(el) {
  const R = 44, K = 2 * Math.PI * R;
  const lingkar = sv('circle', { cx: 50, cy: 50, r: R, class: 'tc-isi', 'stroke-dasharray': K, 'stroke-dashoffset': 0 });
  const angka = h('b.tc-angka', '–');
  el.innerHTML = '';
  el.append(h('div.timer-cincin', sv('svg', { viewBox: '0 0 100 100' }, sv('circle', { cx: 50, cy: 50, r: R, class: 'tc-latar' }), lingkar), angka));
  let raf = 0, akhir = 0, total = 1, cb = {}, sisaLama = -1;
  const T = {
    jalan: false,
    mulai(detik, c = {}) {
      cancelAnimationFrame(raf); total = detik * 1000; akhir = performance.now() + total; cb = c; sisaLama = -1; T.jalan = true; el.classList.remove('kritis', 'habis');
      const langkah = now => {
        const sisa = Math.max(0, akhir - now), s = Math.ceil(sisa / 1000);
        lingkar.setAttribute('stroke-dashoffset', K * (1 - sisa / total));
        if (s !== sisaLama) { sisaLama = s; angka.textContent = s; if (s <= (cb.kritis || 5) && s > 0) { el.classList.add('kritis'); if (cb.suara) cb.suara(s); else Suara.tik(); cb.tik && cb.tik(s); } else el.classList.remove('kritis'); }
        if (sisa <= 0) { T.jalan = false; el.classList.add('habis'); el.classList.remove('kritis'); cb.habis && cb.habis(); return; }
        raf = requestAnimationFrame(langkah);
      };
      raf = requestAnimationFrame(langkah);
    },
    henti() { cancelAnimationFrame(raf); T.jalan = false; el.classList.remove('kritis'); },
    kurangi(detik) { if (T.jalan) akhir -= detik * 1000; },
    sisa() { return T.jalan ? Math.max(0, (akhir - performance.now()) / 1000) : 0; },
    set(teks) { angka.textContent = teks; lingkar.setAttribute('stroke-dashoffset', 0); el.classList.remove('kritis', 'habis'); }
  };
  return T;
}

/* ---------- Angka berputar ---------- */
function angkaPutar(el, ke, { dur = 900, fmt = v => desimalID(v, 1), saatSelesai } = {}) {
  if (!GERAK_HALUS) { el.textContent = fmt(ke); saatSelesai && saatSelesai(); return; }

          h('button.btn.ghost.kecil', { on: { click: () => editorAdegan(el, a, ulang) } }, ik('edit'), 'Ubah'),
          !a.bawaan ? h('button.iconbtn.kecil', { 'aria-label': 'Hapus adegan', html: ikon('trash'), on: { click: async () => { if (await konfirmasi('Hapus adegan?', esc(a.nama), 'Hapus')) { S.adegan.splice(k, 1); simpan(); ulang(); } } } }) : null))),
        h('div.aksi', h('button.btn.primary', { on: { click: async () => {
          const f = await pilihBerkas('image/*'); if (!f) return;
          try {
            const url = await kecilkanGambar(f, 1600, .8), im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
            const a = { id: 'u' + uid(), nama: 'Adegan ' + (S.adegan.length + 1), bawaan: false, aktif: true, gambar: url, lebar: im.naturalWidth, tinggi: im.naturalHeight, petunjuk: [] };
            S.adegan.push(a); if (!simpan()) { S.adegan.pop(); toast('Penyimpanan penuh. Hapus adegan unggahan lain dulu.', 'warn', 4500); return; }
            editorAdegan(el, a, ulang);
          } catch (e) { toast('Gambar tidak dapat dibaca.', 'warn'); }
        } } }, ik('upload'), 'Tambah Adegan dari Gambar')));
    }],
    ['main', 'Permainan', 'game', el => {
      el.append(h('label.cek', h('input', { type: 'checkbox', checked: S.cfg.bantuan, on: { change: e => { S.cfg.bantuan = e.target.checked; simpan(); } } }), h('span', h('b', 'Tombol Bantuan'), h('br'), h('small.catatan', `Menandai area sekitar satu petunjuk dengan biaya ${POIN_BANTUAN} poin.`))),
        h('div.st-opsi.kiri', h('b', 'Penalti sentuhan salah'), h('div.seg', [1, 2, 3].map(v => h('button' + (S.cfg.penalti === v ? '.on' : ''), { on: { click: e => { S.cfg.penalti = v; simpan(); $$('button', e.currentTarget.parentNode).forEach(b => b.classList.toggle('on', b === e.currentTarget)); } } }, `−${v} dtk`)))),
        h('h3', 'Polling refleksi'), h('p', `Sudah cukup: ${S.polling.cukup} · Belum cukup: ${S.polling.belum}`),
        h('div.aksi', h('button.btn.ghost.kecil', { on: { click: () => { S.polling = { cukup: 0, belum: 0 }; simpan(); toast('Polling direset.', 'ok'); } } }, ik('refresh'), 'Reset Polling')));
    }],
    ['data', 'Data', 'download', (el, ulang) => tabDataLab(el, ulang, 'detektif-visual-data',
      h('div', h('h3', 'Papan peringkat'), h('p.catatan', `${S.peringkat.length} skor tersimpan.`),
        h('div.aksi', h('button.btn.ghost', { disabled: !S.peringkat.length, on: { click: () => unduhCSV([['Peringkat', 'Nama', 'Skor', 'Ditemukan', 'Total', 'Adegan', 'Waktu'], ...S.peringkat.map((p, i) => [i + 1, p.nama, p.skor, p.ditemukan, p.total, p.adegan, p.waktu])], `peringkat-detektif-${tglFile()}.csv`) } }, ik('download'), 'Unduh Peringkat CSV'),
          h('button.btn.danger.kecil', { disabled: !S.peringkat.length, on: { click: async () => { if (await konfirmasi('Hapus papan peringkat?', 'Semua skor dihapus.', 'Hapus')) { S.peringkat = []; simpan(); ulang(); } } } }, ik('trash'), 'Hapus Peringkat'))))]
  ], () => { if (D.fase === 'sampul') tampilSampul(); });
}
/* Editor titik petunjuk */
function editorAdegan(el, a, kembali) {
  el.innerHTML = '';
  const H = tinggiAdegan(a);
  const kanvas = h('div.ed-adegan', { style: { '--ar': 1600 / H }, html: isiGambar(a) });
  const tanda = sv('svg', { viewBox: `0 0 1600 ${H}`, class: 'lapis-tanda ed-tanda' });
  kanvas.appendChild(tanda);
  const gambarTanda = () => { tanda.innerHTML = ''; a.petunjuk.forEach((p, k) => { const g = bentukTanda(p, H, 'ed', k + 1); g.dataset.k = k; tanda.appendChild(g); }); daftar(); };
  const isianPetunjuk = async (p, baru) => {
    const inJ = h('input.inp', { value: p.judul || '', maxlength: 40, placeholder: 'mis. Papan nama toko' });
    const inT = h('textarea.inp', { rows: 3, maxlength: 200, placeholder: 'mis. Papan ini mengungkap nama jalan.' }); inT.value = p.teks || '';
    const ukuran = p.w ? 'kotak' : String(p.r || 50);
    let pilihUk = ukuran;
    const seg = h('div.seg', [['30', 'Kecil'], ['50', 'Sedang'], ['80', 'Besar'], ['120', 'Sangat besar']].map(([v, t]) => h('button' + (pilihUk === v ? '.on' : ''), { on: { click: e => { pilihUk = v; $$('button', seg).forEach(b => b.classList.toggle('on', b === e.currentTarget)); } } }, t)));
    const hasil = await modal({ judul: baru ? 'Petunjuk baru' : 'Ubah petunjuk', isi: h('div.form', h('label', 'Nama petunjuk', inJ), h('label', 'Kartu penjelasan', inT), h('div.vg-lbl', 'Ukuran area sentuh'), seg, p.w ? h('p.catatan', 'Petunjuk bawaan berbentuk kotak; memilih ukuran akan mengubahnya menjadi lingkaran.') : null),
      tombol: [...(baru ? [] : [{ teks: 'Hapus', kelas: 'danger', nilai: 'hapus' }]), { teks: 'Batal', nilai: null }, { teks: 'Simpan', kelas: 'primary', nilai: 'ok' }] });
    if (hasil === 'hapus') { a.petunjuk.splice(a.petunjuk.indexOf(p), 1); simpan(); gambarTanda(); return; }
    if (hasil !== 'ok') { if (baru) { a.petunjuk.splice(a.petunjuk.indexOf(p), 1); gambarTanda(); } return; }
    p.judul = inJ.value.trim() || 'Petunjuk'; p.teks = inT.value.trim() || 'Petunjuk ini mengungkap lokasi.';
    if (pilihUk !== 'kotak') { delete p.w; delete p.h; p.r = Number(pilihUk); }
    simpan(); gambarTanda();
  };
  kanvas.addEventListener('click', e => {
    const r = kanvas.getBoundingClientRect(), X = (e.clientX - r.left) / r.width * 1600, Y = (e.clientY - r.top) / r.width * 1600;
    const ada = a.petunjuk.find(p => kenaPetunjuk(p, X, Y, H, 0));
    if (ada) { isianPetunjuk(ada, false); return; }
    const p = { x: +(X / 1600).toFixed(4), y: +(Y / H).toFixed(4), r: 50, judul: '', teks: '' };
    a.petunjuk.push(p); gambarTanda(); isianPetunjuk(p, true);
  });
  const daftarEl = h('ol.ed-daftar');
  const daftar = () => { daftarEl.innerHTML = ''; a.petunjuk.forEach(p => daftarEl.append(h('li', h('b', p.judul || '(tanpa nama)'), ' – ', p.teks))); };
  el.append(h('div.ed-kepala', h('button.btn.ghost.kecil', { on: { click: () => { simpan(); kembali(); } } }, ik('back'), 'Kembali'),
      h('input.inp.ed-nama', { value: a.nama, maxlength: 40, on: { change: e => { a.nama = e.target.value.trim() || a.nama; simpan(); } } }),
      a.bawaan ? h('button.btn.ghost.kecil', { on: { click: async () => { if (await konfirmasi('Pulihkan adegan bawaan?', 'Titik dan keterangan kembali seperti awal.', 'Pulihkan')) { const asli = ADEGAN_BAWAAN.find(x => x.id === a.id); a.petunjuk = JSON.parse(JSON.stringify(asli.petunjuk)); a.nama = asli.nama; simpan(); editorAdegan(el, a, kembali); } } } }, ik('refresh'), 'Pulihkan') : null),
    h('p.catatan', 'Sentuh gambar untuk menambah titik petunjuk. Sentuh titik yang ada untuk mengubah atau menghapusnya. Disarankan 6 petunjuk per adegan.'),
    kanvas, daftarEl);
  gambarTanda();
}

/* ---------- Mulai ---------- */
function mulaiG3() {
  muat();
  Suara.on = S.cfg.suara !== false;
  siapkanBilahLab();
  $('#btn-simpan').append(ik('download'), 'Simpan Hasil');
  $('#btn-simpan').addEventListener('click', () => { Suara.klik(); simpanHasil(); });
  $('#btn-info').addEventListener('click', () => { Suara.klik(); petunjuk(); });
  siapkanGearLab(bukaGuru);
  pasangSentuh();
  tampilSampul();
  if (!simpanOK) setTimeout(() => toast('Penyimpanan peramban tidak tersedia. Skor hanya bertahan selama halaman terbuka.', 'warn', 5000), 1200);
}
document.addEventListener('DOMContentLoaded', mulaiG3);
