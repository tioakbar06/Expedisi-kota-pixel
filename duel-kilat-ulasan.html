  const lbl = $('.label-mapel', P); lbl.textContent = T.soal.mapel; lbl.style.background = warnaMapel(T.soal.mapel); lbl.style.color = T.soal.mapel === 'Matematika' ? '#1D3557' : '#fff';
  $('.teks-soal', P).textContent = T.soal.soal;
  $('.kp-penjelasan', P).className = 'kp-penjelasan';
  $('.layar-jawab', P).className = 'layar-jawab';
  const kartu = $('.kp-kartu', P); kartu.classList.remove('masuk'); void kartu.offsetWidth; kartu.classList.add('masuk');
  segarPanel(i);
}
function segarPanel(i) {
  const T = K.tim[i], P = $('#panel-' + i); if (!P) return;
  $('.layar-jawab .isi', P).textContent = T.input ? angkaRibu(Number(T.input), 0) : '';
  $('.kp-hitung', P).textContent = S.cfg.akhir === 'jumlah' ? `Soal ${Math.min(T.dijawab + 1, S.cfg.jumlah)} / ${S.cfg.jumlah} · ${T.benar} benar` : `${T.benar} benar`;
  $$('.keypad button', P).forEach(b => b.disabled = T.kunci || K.fase !== 'main' || !T.soal);
  $('.btn-lewati', P).disabled = T.kunci || K.fase !== 'main' || !T.soal;
  const ab = $('#ai-benar-' + i); if (ab && !(K.mode === 'solo' && i === 1)) ab.textContent = `${T.benar} benar`;
}
function tombol(i, t) {
  const T = K.tim[i]; if (K.fase !== 'main' || T.kunci || !T.soal) return;
  Suara.init();
  if (t === 'OK') return periksa(i);
  if (t === '⌫') T.input = T.input.slice(0, -1);
  else if (T.input.length < 7) T.input = (T.input === '0' ? '' : T.input) + t;
  Suara.nada(700 + Number(t || 0) * 30, .04, 'square', .06);
  segarPanel(i);
}
function periksa(i) {
  const T = K.tim[i], P = $('#panel-' + i);
  if (!T.input) { const l = $('.layar-jawab', P); l.classList.remove('getar'); void l.offsetWidth; l.classList.add('getar'); return; }
  const benar = Number(T.input) === Number(T.soal.jawaban), mapel = T.soal.mapel;
  T.perMapel[mapel] = T.perMapel[mapel] || { benar: 0, total: 0 };
  if (benar) {
    T.benar++; T.dijawab++; T.perMapel[mapel].benar++; T.perMapel[mapel].total++;
    T.log.push({ soal: T.soal.soal, mapel, jawaban: Number(T.input), benar: true, waktu: +((performance.now() - T.mulaiSoal) / 1000).toFixed(1) });
    T.kunci = true;
    $('.layar-jawab', P).className = 'layar-jawab benar';
    const pj = $('.kp-penjelasan', P); pj.innerHTML = ''; pj.append(h('b', { html: ikon('check') + ' Benar! Tambang tertarik.' }), h('p', T.soal.penjelasan || `Jawaban: ${T.soal.jawaban}`)); pj.className = 'kp-penjelasan on';
    Suara.benar(); tarik(i); segarPanel(i);
    const sesi = K.sesi;
    setTimeout(() => { if (sesi === K.sesi && K.fase === 'main') soalBaru(i); }, 2000);
  } else {
    T.salah++;
    T.log.push({ soal: T.soal.soal, mapel, jawaban: Number(T.input), benar: false });
    Suara.salah();
    const l = $('.layar-jawab', P); l.className = 'layar-jawab salah'; void l.offsetWidth; l.classList.add('getar');
    T.input = ''; T.kunci = true; segarPanel(i);
    setTimeout(() => { T.kunci = false; l.classList.remove('salah'); segarPanel(i); }, 700);
  }
}
function lewati(i) {
  const T = K.tim[i]; if (K.fase !== 'main' || T.kunci || !T.soal) return;
  const mapel = T.soal.mapel; T.perMapel[mapel] = T.perMapel[mapel] || { benar: 0, total: 0 }; T.perMapel[mapel].total++;
  T.lewat++; T.dijawab++; T.log.push({ soal: T.soal.soal, mapel, jawaban: null, benar: false, dilewati: true });
  Suara.nada(400, .12, 'triangle', .1, 0, -100);
  soalBaru(i);
}
function tampilSelesaiTim(i) {
  const P = $('#panel-' + i); if (!P) return;
  $('.teks-soal', P).textContent = 'Semua soal selesai. Tunggu lawan…'; $('.label-mapel', P).textContent = 'Selesai'; $('.label-mapel', P).style.background = '#5A6B85';
  segarPanel(i);
}
function cekSelesaiJumlah() {
  const aktif = K.mode === 'solo' ? [K.tim[0]] : K.tim;
  if (aktif.every(T => T.dijawab >= S.cfg.jumlah)) selesai(null, 'jumlah');
}
/* keyboard untuk mode lawan Si Pelacak */
document.addEventListener('keydown', e => {
  if (K.fase !== 'main' || K.mode !== 'solo' || $('#guru.on') || $('#modal.on')) return;
  if (/^[0-9]$/.test(e.key)) tombol(0, e.key); else if (e.key === 'Backspace') tombol(0, '⌫'); else if (e.key === 'Enter') tombol(0, 'OK');
});

/* ---------- Waktu & lawan bot ---------- */
function putarWaktu() {
  const now = performance.now(), el = $('#ai-waktu');
  if (K.fase !== 'main') return;
  if (S.cfg.akhir === 'waktu') {
    const sisa = Math.max(0, S.cfg.durasi * 60 - (now - K.mulai) / 1000), tt = Math.ceil(sisa), m = Math.floor(tt / 60), s = tt % 60;
    if (el) { el.textContent = `${m}:${String(s).padStart(2, '0')}`; el.classList.toggle('kritis', sisa <= 10); }
    if (sisa <= 10 && Math.ceil(sisa) !== K.tikT) { K.tikT = Math.ceil(sisa); if (sisa > 0) Suara.tik(); }
    if (sisa <= 0) { selesai(K.pos < 0 ? 0 : K.pos > 0 ? 1 : null, 'waktu'); return; }
  } else if (el) { const d = (now - K.mulai) / 1000; el.textContent = `${Math.floor(d / 60)}:${String(Math.floor(d % 60)).padStart(2, '0')}`; }
  if (K.mode === 'solo' && now - K.botT >= TINGKAT[S.cfg.tingkat] * 1000) {
    K.botT = now; K.tim[1].benar++; tarik(1);
    if (K.fase !== 'main') return;
  }
  $('#lbl-status').textContent = K.pos === 0 ? 'Seimbang' : `${nama(K.pos < 0 ? 0 : 1)} unggul ${Math.abs(K.pos)} langkah`;
  K.timerRaf = requestAnimationFrame(putarWaktu);
}

/* ---------- Selesai & rekap ---------- */
function selesai(pemenang, sebab) {
  if (K.fase !== 'main') return;
  K.fase = 'selesai'; cancelAnimationFrame(K.timerRaf);
  if (pemenang == null) { const [a, b] = K.mode === 'solo' ? [K.tim[0].benar, 0] : [K.tim[0].benar, K.tim[1].benar]; pemenang = K.pos < 0 ? 0 : K.pos > 0 ? 1 : (a > b ? 0 : b > a ? 1 : null); if (K.mode === 'solo' && K.pos === 0) pemenang = null; }
  K.hasilAkhir = { pemenang, sebab, pos: K.pos };
  $$('.keypad button, .btn-lewati').forEach(b => b.disabled = true);
  arenaPesan(sebab === 'finis' ? 'FINIS!' : sebab === 'waktu' ? 'WAKTU HABIS!' : 'SELESAI!');
  Suara.nada(523, .5, 'square', .12);
  S.riwayat.unshift({ waktu: tglISO(), mode: K.mode, nama: [nama(0), nama(1)], benar: K.tim.map(T => T.benar), pemenang: pemenang == null ? 'seri' : nama(pemenang), sebab });
  S.riwayat = S.riwayat.slice(0, 30); simpan();
  setTimeout(tampilHasil, 1600);
}
function rekapMapel() {
  const mapel = Object.keys(MAPEL);
  const cv = h('canvas.grafik.ku-grafik');
  const seri = (K.mode === 'solo' ? [0] : [0, 1]).map(i => ({ nama: nama(i), warna: WARNA_TIM[i], nilai: mapel.map(m => (K.tim[i].perMapel[m] || {}).benar || 0) }));
  requestAnimationFrame(() => grafikBatang(cv, { judul: 'Jawaban benar per mapel', label: mapel, seri, maks: Math.max(3, ...seri.flatMap(s => s.nilai)) }));
  return h('div.ku-rekap', cv);
}
function tampilHasil() {
  const { pemenang, sebab } = K.hasilAkhir;
  if (K.mode === 'tim') {
    layarJuara({ el: $('#layar-hasil'), skor: [K.tim[0].benar, K.tim[1].benar], rincian: h('div', h('p.catatan.tengah', sebab === 'finis' ? `${nama(pemenang)} menarik bendera melewati garis finis!` : `Posisi tambang akhir: ${K.pos === 0 ? 'seimbang' : `${Math.abs(K.pos)} langkah ke ${nama(K.pos < 0 ? 0 : 1)}`}. Skor = jumlah jawaban benar.`), rekapMapel()), saatMainLagi: mulaiPermainan, saatSampul: tampilSampul, saatSimpan: simpanHasil });
    /* pemenang ditentukan tambang, bukan hanya skor */
    if (pemenang != null) { const h1 = $('#layar-hasil h1'); h1.textContent = nama(pemenang); h1.style.color = WARNA_TIM[pemenang]; $('#layar-hasil .juara-label').textContent = 'Juara Tarik Tambang'; }
    else { $('#layar-hasil .juara-label').textContent = 'Hasil Imbang!'; }
    return;
  }
  const menang = pemenang === 0, el = $('#layar-hasil'); el.innerHTML = '';
  const T = K.tim[0];
  el.append(h('div.juara-latar', { style: { '--c': menang ? '#2A9D8F' : '#5A6B85' } }),
    h('div.juara-kartu',
      h('div.juara-piala', { html: menang ? '<svg viewBox="0 0 120 120"><path d="M34 18h52v22a26 26 0 0 1-52 0z" fill="#F4C542" stroke="#1D3557" stroke-width="4"/><path d="M34 26H18c0 16 8 24 18 26M86 26h16c0 16-8 24-18 26" fill="none" stroke="#1D3557" stroke-width="4"/><path d="M52 66h16v16H52z" fill="#E9B23A" stroke="#1D3557" stroke-width="4"/><rect x="38" y="82" width="44" height="14" rx="4" fill="#2A9D8F" stroke="#1D3557" stroke-width="4"/></svg>' : '<svg viewBox="0 0 120 120"><rect x="32" y="40" width="56" height="50" rx="12" fill="#B8C1CC" stroke="#5A6B85" stroke-width="4"/><circle cx="60" cy="64" r="12" fill="#1D3557"/><circle cx="60" cy="64" r="5" fill="#E76F51"/><path d="M60 40V24" stroke="#5A6B85" stroke-width="4"/><circle cx="60" cy="20" r="6" fill="#E76F51"/></svg>' }),
      h('div.juara-label', menang ? 'Kelas Menang!' : pemenang === 1 ? `${NAMA_BOT} Menang` : 'Imbang!'),
      h('h1', { style: { color: menang ? 'var(--teal)' : 'var(--navy)' } }, nama(0)),
      h('div.hasil-angka', h('div', h('small', 'Benar'), h('b', T.benar)), h('div', h('small', 'Salah'), h('b', T.salah)), h('div', h('small', 'Dilewati'), h('b', T.lewat)), h('div', h('small', 'Posisi tambang'), h('b', K.pos === 0 ? '0' : (K.pos < 0 ? '+' : '−') + Math.abs(K.pos)))),
      rekapMapel(),
      h('div.juara-aksi',
        h('button.btn.besar.accent', { on: { click: () => { Suara.klik(); mulaiPermainan(); } } }, ik('refresh'), 'Main Lagi'),
        h('button.btn.besar.primary', { on: { click: () => { Suara.klik(); simpanHasil(); } } }, ik('download'), 'Simpan Hasil'),
        h('button.btn.besar.ghost', { on: { click: () => { Suara.klik(); tampilSampul(); } } }, ik('back'), 'Sampul'))));
  keLayar('layar-hasil');
  if (menang) setTimeout(() => { Suara.menang(); konfeti(GERAK_HALUS ? 200 : 40); }, 350); else Suara.nada(300, .5, 'triangle', .12, 0, -100);
}

/* ---------- Simpan hasil ---------- */
function simpanHasil() {
  Suara.klik();
  if (!K.tim.length) { toast('Belum ada permainan.', 'warn'); return; }
  const tims = K.mode === 'solo' ? [0] : [0, 1];
  const baris = [['Ringkasan', tglISO(), K.mode === 'solo' ? `Lawan ${NAMA_BOT}` : 'Dua Tim', S.cfg.akhir === 'waktu' ? `${S.cfg.durasi} menit` : `${S.cfg.jumlah} soal`], ['Tim', 'Benar', 'Salah', 'Dilewati', ...Object.keys(MAPEL).map(m => `Benar ${m}`)]];
  tims.forEach(i => { const T = K.tim[i]; baris.push([nama(i), T.benar, T.salah, T.lewat, ...Object.keys(MAPEL).map(m => (T.perMapel[m] || {}).benar || 0)]); });
  baris.push(['Pemenang', K.hasilAkhir ? (K.hasilAkhir.pemenang == null ? 'Seri' : nama(K.hasilAkhir.pemenang)) : '-', 'Posisi tambang akhir', K.pos]);
  baris.push([], ['Tim', 'Mapel', 'Soal', 'Jawaban', 'Hasil', 'Waktu (dtk)']);
  tims.forEach(i => K.tim[i].log.forEach(l => baris.push([nama(i), l.mapel, l.soal, l.jawaban ?? '', l.dilewati ? 'dilewati' : l.benar ? 'benar' : 'salah', l.waktu ?? ''])));
  unduhCSV(baris, `duel-kilat-ulasan-${tglFile()}.csv`);
  const cv = $('#layar-hasil .ku-grafik'); if (cv) setTimeout(() => unduhCanvas(cv, `rekap-mapel-kilat-ulasan-${tglFile()}.png`), 400);
}

/* ---------- Panel Guru ---------- */
function bukaGuru() {
  const main = K.fase === 'main';
  panelGuruLab('Duel Kilat Ulasan', [
    ['bank', 'Bank Soal', 'list', (el, ulang) => {
      el.append(h('p.catatan', `${S.bank.length} soal. Jawaban harus bilangan bulat (keypad angka). Mapel: IPA, Matematika, KKA, IPS.`),
        h('div.aksi', h('button.btn.primary', { on: { click: () => { S.bank.push({ id: 'q' + uid(), mapel: 'IPA', soal: '', jawaban: 0, penjelasan: '' }); simpan(); ulang(); } } }, ik('plus'), 'Tambah Soal'),
          h('button.btn.ghost', { on: { click: () => unduhJSON({ media: 'G4 Duel Kilat Ulasan', bank: S.bank }, `bank-soal-kilat-ulasan-${tglFile()}.json`) } }, ik('download'), 'Ekspor JSON'),
          h('button.btn.ghost', { on: { click: async () => { const f = await pilihBerkas('application/json,.json'); if (!f) return; try { const d = JSON.parse(await f.text()), arr = Array.isArray(d) ? d : d.bank; if (!Array.isArray(arr)) throw new Error('daftar soal tidak ditemukan'); S.bank = arr.filter(q => q && q.soal).map(q => ({ id: q.id || 'q' + uid(), mapel: MAPEL[q.mapel] ? q.mapel : 'IPA', soal: String(q.soal), jawaban: Math.round(Number(q.jawaban) || 0), penjelasan: String(q.penjelasan || '') })); simpan(); toast(`${S.bank.length} soal diimpor.`, 'ok'); ulang(); } catch (e) { toast('Impor gagal: ' + e.message, 'warn'); } } } }, ik('upload'), 'Impor JSON'),
          h('button.btn.ghost', { on: { click: async () => { if (await konfirmasi('Pulihkan bank bawaan?', '20 soal bawaan (12 dari spesifikasi + 8 tambahan).', 'Pulihkan')) { S.bank = BANK_BAWAAN.map(q => ({ ...q })); simpan(); ulang(); } } } }, ik('refresh'), 'Bawaan')),
        h('div.bank-daftar', S.bank.map((q, k) => h('div.bank-item', { style: { '--c': warnaMapel(q.mapel) } },
          h('div.bi-kiri', h('span.bi-no', k + 1), h('select.inp', { on: { change: e => { q.mapel = e.target.value; simpan(); ulang(); } } }, Object.keys(MAPEL).map(m => h('option', { value: m, selected: q.mapel === m }, m)))),
          h('div.bi-tengah', h('textarea.inp', { rows: 2, maxlength: 240, placeholder: 'Teks soal', on: { change: e => { q.soal = e.target.value.trim(); simpan(); } } }, q.soal),
            h('textarea.inp', { rows: 1, maxlength: 240, placeholder: 'Penjelasan singkat (tampil 2 detik setelah benar)', on: { change: e => { q.penjelasan = e.target.value.trim(); simpan(); } } }, q.penjelasan)),
          h('label.bi-jawab', 'Jawaban', h('input.inp', { type: 'number', step: 1, value: q.jawaban, on: { change: e => { const v = Math.round(Number(e.target.value)); if (Number.isFinite(v)) { q.jawaban = v; e.target.value = v; simpan(); } } } })),
          h('button.iconbtn.kecil', { 'aria-label': 'Hapus soal', html: ikon('trash'), on: { click: () => { S.bank.splice(k, 1); simpan(); ulang(); } } })))));
    }],
    ['main', 'Permainan', 'game', (el, ulang) => {
      el.append(h('div.st-opsi.kiri', h('b', 'Jarak ke garis finis (langkah tarikan)'), h('div.seg', [4, 5, 6, 7, 8].map(v => h('button' + (S.cfg.langkah === v ? '.on' : ''), { on: { click: () => { S.cfg.langkah = v; simpan(); ulang(); } } }, v)))),
        h('p.catatan', `Saat ini ${S.cfg.langkah} jawaban benar beruntun (tanpa balasan lawan) membawa bendera ke garis finis.`),
        h('h3', 'Riwayat permainan'), h('p.catatan', `${S.riwayat.length} permainan tersimpan.`),
        h('div.aksi', h('button.btn.ghost', { disabled: !S.riwayat.length, on: { click: () => unduhCSV([['Waktu', 'Mode', 'Kiri', 'Benar kiri', 'Kanan', 'Benar kanan', 'Pemenang', 'Sebab'], ...S.riwayat.map(r => [r.waktu, r.mode, r.nama[0], r.benar[0], r.nama[1], r.benar[1], r.pemenang, r.sebab])], `riwayat-kilat-ulasan-${tglFile()}.csv`) } }, ik('download'), 'Unduh Riwayat CSV'),
          h('button.btn.danger.kecil', { disabled: !S.riwayat.length, on: { click: () => { S.riwayat = []; simpan(); ulang(); } } }, ik('trash'), 'Hapus Riwayat')));
    }],
    ['data', 'Data', 'download', (el, ulang) => tabDataLab(el, ulang, 'kilat-ulasan-data')]
  ], () => { if (K.fase === 'sampul') tampilSampul(); else toast('Perubahan berlaku pada permainan berikutnya.', 'info'); });
  if (main) toast('Permainan tetap berjalan selama Panel Guru terbuka.', 'info', 3000);
}

/* ---------- Mulai ---------- */
function mulaiG4() {
  muat();
  Suara.on = S.cfg.suara !== false;
  siapkanBilahLab();
  $('#btn-simpan').append(ik('download'), 'Simpan Hasil');
  $('#btn-simpan').addEventListener('click', simpanHasil);
  $('#btn-info').addEventListener('click', () => { Suara.klik(); petunjuk(); });
  siapkanGearLab(bukaGuru);
  tampilSampul();
  if (!simpanOK) setTimeout(() => toast('Penyimpanan peramban tidak tersedia. Bank soal hanya bertahan selama halaman terbuka.', 'warn', 5000), 1200);
}
document.addEventListener('DOMContentLoaded', mulaiG4);

</script>
